<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>카페 · 콘카</title>
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <script>
      // 카페 관리(정보 수정 등)는 카페 상세(/cafe)로 합쳤다. 관리자·카페 운영자로 로그인하면 그곳에 수정 버튼이 보인다
      window.location.replace("/cafe" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>카페 관리는 <a href="/cafes">카페 목록</a>에서 카페를 선택해 할 수 있습니다.</p>
  </body>
</html>
