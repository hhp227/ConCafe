<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카페 목록 · 콘카</title>
    <meta name="description" content="콘카에 등록된 메이드·집사·아이돌 등 콘셉트 카페 목록을 한눈에 보고, 캐스트 스케줄과 지도 위치를 확인할 수 있습니다." />
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/">
            <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />
            <span class="brand-title" aria-label="콘셉카페">
              <span class="brand-main">콘</span><span class="brand-sub">셉</span><span class="brand-main">카</span><span class="brand-sub">페</span>
            </span>
          </a>
          <div class="topbar-right">
            <nav class="nav-links app-nav" aria-label="주요 메뉴">
              <a class="nav-link" href="/registration" data-nav-roles="ADMIN,CAFE_OWNER" style="display: none;">캐스트 스케줄 등록</a>
              <a class="nav-link" href="/schedule">캐스트 스케줄 조회</a>
              <a class="nav-link" href="/cafes">카페 목록</a>
              <a class="nav-link" href="/map">메이드 카페 지도</a>
              <a class="nav-link" id="adminNavLink" href="/admin" style="display: none;">관리자</a>
            </nav>
            <div class="auth-widget" id="authWidget">
              <div class="auth-user-info" id="authUserInfo" style="display:none;">
                <img class="auth-user-photo" id="authUserPhoto" src="" alt="프로필" />
                <span class="auth-user-name" id="authUserName"></span>
                <button class="auth-btn signout" id="signOutBtn" type="button">로그아웃</button>
              </div>
              <button class="auth-btn" id="signInBtn" type="button">로그인</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container">
        <div class="page">
          <section class="hero">
            <div class="surface hero-copy">
              <div class="eyebrow">콘셉트 카페</div>
              <h1>카페 목록</h1>
              <p>콘카에 등록된 카페를 둘러보세요. 카페를 누르면 영업 정보와 함께 캐스트 스케줄, 지도 위치로 이동할 수 있습니다.</p>
            </div>

            <aside class="surface hero-meta">
              <div class="stat-list">
                <div class="stat">
                  <span class="stat-label">전체 카페</span>
                  <strong class="stat-value" id="cafeCount">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">검색 결과</span>
                  <strong class="stat-value" id="filteredCount">0</strong>
                </div>
              </div>
              <a class="button button-secondary" href="/map">지도에서 카페 찾기</a>
            </aside>
          </section>

          <section class="surface section" style="margin-top: 20px;">
            <div class="section-header">
              <div>
                <h2>카페 목록</h2>
                <p>국가와 도시를 고르고, 이름·주소 검색이나 컨셉으로 좁혀 볼 수 있습니다.</p>
              </div>
            </div>
            <div class="region-filter">
              <div class="filter-chips" id="countryFilter" role="radiogroup" aria-label="국가"></div>
              <div class="filter-chips sub" id="cityFilter" role="radiogroup" aria-label="도시" hidden></div>
              <p class="helper small" id="regionFilterNote"></p>
            </div>
            <div class="cafe-toolbar">
              <input id="cafeSearch" type="search" placeholder="카페 이름 또는 주소로 검색" aria-label="카페 검색" />
              <select id="cafeConceptFilter" aria-label="컨셉 필터">
                <option value="">모든 컨셉</option>
              </select>
            </div>
            <div class="cafe-grid" id="cafeGrid"></div>
            <p class="empty" id="cafeEmptyState">카페 목록을 불러오는 중입니다.</p>
          </section>
        </div>
        <footer class="footer">
          <span>© 2026 콘카(ConCafe)</span>
          <span><a href="/privacy">개인정보처리방침</a></span>
        </footer>
      </main>
    </div>

    <!-- 카페 정보 모달 -->
    <div class="admin-modal" id="cafeModal" role="dialog" aria-modal="true" aria-labelledby="cafeModalTitle" hidden>
      <div class="admin-modal-box" style="max-width: 600px;">
        <button class="admin-modal-close" type="button" data-close-modal aria-label="닫기">✕</button>
        <div class="cafe-detail-head">
          <div class="cafe-detail-thumb" id="cafeModalThumb"></div>
          <div>
            <div class="chip-row" id="cafeModalChips"></div>
            <h2 id="cafeModalTitle" style="margin: 10px 0 6px;"></h2>
            <dl class="cafe-info-list" id="cafeModalInfo"></dl>
          </div>
        </div>
        <div class="cafe-gallery-strip" id="cafeModalGallery"></div>
        <div class="button-row" style="margin-top: 20px;">
          <a class="button button-primary" id="cafeModalScheduleLink" href="/schedule">캐스트 스케줄 보기</a>
          <a class="button button-secondary" id="cafeModalMapLink" href="/map">지도에서 보기</a>
        </div>
      </div>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-common.js"></script>
    <script>
      (function () {
        const A = window.ConcafeAdmin;
        const escapeHtml = A.escapeHtml;
        const SEARCH_KEY = "concafe.cafes.search";

        const REGION_KEY = "concafe.cafes.region";
        const COUNTRY_ORDER = ["KR", "JP"];

        // country: "" = 전체, city: "" = 그 나라 전체
        const state = { cafes: [], loaded: false, country: "", city: "", detectedCountry: "", regionChosen: false };
        const el = {};
        [
          "cafeCount", "filteredCount", "cafeSearch", "cafeConceptFilter", "cafeGrid", "cafeEmptyState",
          "countryFilter", "cityFilter", "regionFilterNote",
          "cafeModal", "cafeModalThumb", "cafeModalChips", "cafeModalTitle", "cafeModalInfo", "cafeModalGallery",
          "cafeModalScheduleLink", "cafeModalMapLink",
        ].forEach(function (id) { el[id] = document.getElementById(id); });

        function regionText(cafe) {
          return cafe.address || A.cityLabel(cafe.country, cafe.city) || "지역 정보 없음";
        }

        // ---------- 국가 / 도시 필터 ----------

        // 접속자의 나라를 브라우저 시간대(우선)와 언어 설정으로 추정한다. 위치 권한은 묻지 않는다
        function detectVisitorCountry() {
          let timeZone = "";
          try {
            timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
          } catch (error) {
            timeZone = "";
          }
          if (timeZone === "Asia/Seoul") return "KR";
          if (timeZone === "Asia/Tokyo") return "JP";
          const languages = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
          for (const language of languages) {
            const code = String(language || "").toLowerCase();
            if (code.indexOf("ko") === 0) return "KR";
            if (code.indexOf("ja") === 0) return "JP";
          }
          return "";
        }

        function loadSavedRegion() {
          try {
            const saved = JSON.parse(sessionStorage.getItem(REGION_KEY) || "null");
            if (saved && typeof saved.country === "string" && typeof saved.city === "string") {
              return saved;
            }
          } catch (error) {
            // 저장된 값이 없거나 읽을 수 없으면 접속 위치 기준으로 시작한다
          }
          return null;
        }

        function saveRegion() {
          try {
            sessionStorage.setItem(REGION_KEY, JSON.stringify({ country: state.country, city: state.city }));
          } catch (error) {
            // 무시
          }
        }

        function countryLabel(country) {
          return A.COUNTRY_LABELS[country] || country;
        }

        // 나라별 도시 목록: 미리 정한 도시(서울·부산·대구… / 도쿄·오사카·요코하마…) + 데이터에만 있는 도시, '기타'는 맨 뒤
        function citiesOf(country) {
          const known = (A.CITIES[country] || []).map(function (city) { return city[0]; });
          const extra = [];
          state.cafes.forEach(function (cafe) {
            if (cafe.country === country && cafe.city && known.indexOf(cafe.city) < 0 && extra.indexOf(cafe.city) < 0) {
              extra.push(cafe.city);
            }
          });
          const ordered = known.filter(function (city) { return city !== "Etc"; }).concat(extra.sort());
          return known.indexOf("Etc") >= 0 ? ordered.concat(["Etc"]) : ordered;
        }

        function countriesInData() {
          const list = COUNTRY_ORDER.slice();
          state.cafes.forEach(function (cafe) {
            if (cafe.country && list.indexOf(cafe.country) < 0) {
              list.push(cafe.country);
            }
          });
          return list;
        }

        function chipHtml(attr, value, label, count, active) {
          return '<button class="filter-chip' + (active ? " is-active" : "") + (count === 0 ? " is-empty" : "") +
            '" type="button" role="radio" aria-checked="' + active + '" ' + attr + '="' + escapeHtml(value) + '">' +
            escapeHtml(label) + ' <span class="chip-count">' + count + "</span></button>";
        }

        function renderRegionFilter() {
          const countByCountry = {};
          const countByCity = {};
          state.cafes.forEach(function (cafe) {
            countByCountry[cafe.country] = (countByCountry[cafe.country] || 0) + 1;
            const cityKey = cafe.country + ":" + cafe.city;
            countByCity[cityKey] = (countByCity[cityKey] || 0) + 1;
          });
          el.countryFilter.innerHTML = chipHtml("data-country", "", "전체", state.cafes.length, !state.country) +
            countriesInData().map(function (country) {
              return chipHtml("data-country", country, countryLabel(country), countByCountry[country] || 0, state.country === country);
            }).join("");

          el.cityFilter.hidden = !state.country;
          if (state.country) {
            el.cityFilter.innerHTML = chipHtml("data-city", "", countryLabel(state.country) + " 전체", countByCountry[state.country] || 0, !state.city) +
              citiesOf(state.country).map(function (city) {
                return chipHtml("data-city", city, A.cityLabel(state.country, city), countByCity[state.country + ":" + city] || 0, state.city === city);
              }).join("");
          }

          el.regionFilterNote.textContent = !state.regionChosen && state.detectedCountry && state.country === state.detectedCountry
            ? "접속한 지역에 맞춰 " + countryLabel(state.country) + " 카페를 먼저 보여줍니다. 다른 나라는 위에서 고를 수 있습니다."
            : "";
        }

        function setCountry(country) {
          state.country = country;
          state.city = "";
          state.regionChosen = true;
          saveRegion();
          renderRegionFilter();
          renderCafeGrid();
        }

        function setCity(city) {
          state.city = city;
          state.regionChosen = true;
          saveRegion();
          renderRegionFilter();
          renderCafeGrid();
        }

        // 저장된 선택 → 접속 위치 → 전체 순으로 시작 필터를 정한다 (해당 나라에 카페가 없으면 전체)
        function initRegion() {
          state.detectedCountry = detectVisitorCountry();
          const saved = loadSavedRegion();
          const hasCafes = function (country) {
            return state.cafes.some(function (cafe) { return cafe.country === country; });
          };
          if (saved && (!saved.country || hasCafes(saved.country))) {
            state.country = saved.country;
            state.city = saved.country ? saved.city : "";
            state.regionChosen = true;
          } else if (state.detectedCountry && hasCafes(state.detectedCountry)) {
            state.country = state.detectedCountry;
            state.city = "";
          } else {
            state.country = "";
            state.city = "";
          }
          renderRegionFilter();
        }

        // 관리자 카페 목록과 같은 카드 그리드를 쓴다 (승인된 카페만 노출)
        function renderCafeGrid() {
          const keyword = el.cafeSearch.value.trim().toLowerCase();
          const concept = el.cafeConceptFilter.value;
          const filtered = state.cafes.filter(function (cafe) {
            if (state.country && cafe.country !== state.country) return false;
            if (state.city && cafe.city !== state.city) return false;
            if (concept && cafe.conceptType !== concept) return false;
            return !keyword || (cafe.name + " " + cafe.regionLabel).toLowerCase().indexOf(keyword) >= 0;
          });
          el.cafeCount.textContent = String(state.cafes.length);
          el.filteredCount.textContent = String(filtered.length);

          if (!filtered.length) {
            el.cafeGrid.innerHTML = "";
            el.cafeEmptyState.style.display = "";
            el.cafeEmptyState.textContent = !state.loaded ? "카페 목록을 불러오는 중입니다."
              : !state.cafes.length ? "등록된 카페가 없습니다."
              : state.city ? A.cityLabel(state.country, state.city) + "에 조건에 맞는 카페가 없습니다."
              : "검색 결과가 없습니다.";
            return;
          }
          el.cafeEmptyState.style.display = "none";
          el.cafeGrid.innerHTML = filtered.map(function (cafe) {
            const thumb = cafe.thumbnailImage
              ? '<img src="' + escapeHtml(cafe.thumbnailImage) + '" alt="" loading="lazy" />'
              : escapeHtml(cafe.name.slice(0, 1));
            const concept = A.conceptLabel(cafe.conceptType);
            return '<a class="cafe-card" href="#cafe=' + encodeURIComponent(cafe.id) + '" data-cafe-id="' + escapeHtml(cafe.id) + '">' +
              '<div class="cafe-card-thumb">' + thumb + "</div>" +
              '<div class="cafe-card-body">' +
              '<h3 class="cafe-card-name" title="' + escapeHtml(cafe.name) + '">' + escapeHtml(cafe.name) + "</h3>" +
              '<p class="cafe-card-region">' + escapeHtml(regionText(cafe)) + "</p>" +
              '<div class="chip-row">' + (concept ? '<span class="chip">' + escapeHtml(concept) + "</span>" : "") + "</div>" +
              "</div></a>";
          }).join("");
        }

        // ---------- 카페 정보 모달 ----------

        function openCafeModal(cafeId) {
          const cafe = state.cafes.find(function (item) { return item.id === cafeId; });
          if (!cafe) {
            return;
          }
          el.cafeModalTitle.textContent = cafe.name;
          el.cafeModalThumb.innerHTML = A.cafeThumbHtml(cafe);
          const concept = A.conceptLabel(cafe.conceptType);
          el.cafeModalChips.innerHTML = concept ? '<span class="chip">' + escapeHtml(concept) + "</span>" : "";
          const rows = [
            ["지역", [A.COUNTRY_LABELS[cafe.country] || cafe.country, A.cityLabel(cafe.country, cafe.city)].filter(Boolean).join(" · ")],
            ["주소", cafe.address],
            ["전화번호", cafe.phoneNumber],
            ["영업시간", cafe.businessHours],
            ["소개", cafe.desc],
          ].filter(function (row) { return row[1]; });
          el.cafeModalInfo.innerHTML = rows.map(function (row) {
            return "<dt>" + escapeHtml(row[0]) + "</dt><dd>" + escapeHtml(row[1]) + "</dd>";
          }).join("");
          el.cafeModalGallery.innerHTML = cafe.galleryImages.filter(function (url) {
            return url !== cafe.thumbnailImage;
          }).map(function (url) {
            return '<img src="' + escapeHtml(url) + '" alt="" loading="lazy" />';
          }).join("");
          el.cafeModalScheduleLink.href = "/schedule?cafeId=" + encodeURIComponent(cafe.id);
          el.cafeModalMapLink.href = "/map?cafeId=" + encodeURIComponent(cafe.id);
          el.cafeModalMapLink.hidden = cafe.lat == null || cafe.lng == null;
          el.cafeModal.hidden = false;
          el.cafeModal.querySelector(".admin-modal-close").focus();
        }

        function closeCafeModal() {
          if (el.cafeModal.hidden) {
            return;
          }
          el.cafeModal.hidden = true;
          if (/^#cafe=/.test(window.location.hash)) {
            history.replaceState(null, "", window.location.pathname + window.location.search);
          }
        }

        function syncModalWithHash() {
          const match = /^#cafe=(.+)$/.exec(window.location.hash);
          if (match) {
            openCafeModal(decodeURIComponent(match[1]));
          } else {
            closeCafeModal();
          }
        }

        // ---------- 불러오기 ----------

        async function loadCafes() {
          try {
            const snapshot = await A.db.collection("cafes").where("approved", "==", true).get();
            state.cafes = snapshot.docs.map(A.toCafe).sort(function (a, b) {
              return a.name.localeCompare(b.name, "ko");
            });
            state.loaded = true;
            initRegion();
          } catch (error) {
            console.error(error);
            state.loaded = true;
            window.ConcafeToast.show("error", "카페 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.");
          }
          renderCafeGrid();
          syncModalWithHash();
        }

        // ---------- 이벤트 연결 ----------

        el.cafeConceptFilter.innerHTML += A.CONCEPT_TYPES.map(function (type) {
          return '<option value="' + type[0] + '">' + escapeHtml(type[1]) + "</option>";
        }).join("");
        try {
          el.cafeSearch.value = sessionStorage.getItem(SEARCH_KEY) || "";
        } catch (error) {
          // 저장소를 쓸 수 없으면 빈 검색어로 시작한다
        }
        el.cafeSearch.addEventListener("input", function () {
          try {
            sessionStorage.setItem(SEARCH_KEY, el.cafeSearch.value);
          } catch (error) {
            // 무시
          }
          renderCafeGrid();
        });
        el.cafeConceptFilter.addEventListener("change", renderCafeGrid);
        el.countryFilter.addEventListener("click", function (e) {
          const chip = e.target.closest("[data-country]");
          if (chip) {
            setCountry(chip.getAttribute("data-country"));
          }
        });
        el.cityFilter.addEventListener("click", function (e) {
          const chip = e.target.closest("[data-city]");
          if (chip) {
            setCity(chip.getAttribute("data-city"));
          }
        });
        window.addEventListener("hashchange", syncModalWithHash);
        el.cafeModal.addEventListener("click", function (e) {
          if (e.target === el.cafeModal || e.target.closest("[data-close-modal]")) {
            closeCafeModal();
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeCafeModal();
          }
        });

        renderCafeGrid();
        A.initAuthWidget(null);
        loadCafes();
      })();
    </script>
    <script src="/assets/js/admin-nav.js"></script>
  </body>
</html>
