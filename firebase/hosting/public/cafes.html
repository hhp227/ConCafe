<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카페 목록 · 콘카</title>
    <meta name="description" content="콘카에 등록된 메이드·집사·아이돌 등 콘셉트 카페 목록을 한눈에 보고, 캐스트 스케줄과 지도 위치를 확인할 수 있습니다." />
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/">
            <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />
            <span class="brand-title" aria-label="콘셉카페">
              <span class="brand-main">콘</span><span class="brand-sub">셉</span><span class="brand-main">카</span><span class="brand-sub">페</span>
            </span>
          </a>
          <div class="topbar-right">
            <nav class="nav-links app-nav" aria-label="주요 메뉴">
              <a class="nav-link" href="/registration" data-nav-roles="ADMIN,CAFE_OWNER" style="display: none;">캐스트 스케줄 등록</a>
              <a class="nav-link" href="/schedule">캐스트 스케줄 조회</a>
              <a class="nav-link" href="/cafes">카페 목록</a>
              <a class="nav-link" href="/map">메이드 카페 지도</a>
              <a class="nav-link" id="adminNavLink" href="/admin" style="display: none;">관리자</a>
            </nav>
            <div class="auth-widget" id="authWidget">
              <div class="auth-user-info" id="authUserInfo" style="display:none;">
                <img class="auth-user-photo" id="authUserPhoto" src="" alt="프로필" />
                <span class="auth-user-name" id="authUserName"></span>
                <button class="auth-btn signout" id="signOutBtn" type="button">로그아웃</button>
              </div>
              <button class="auth-btn" id="signInBtn" type="button">로그인</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container">
        <div class="page">
          <section class="hero">
            <div class="surface hero-copy">
              <div class="eyebrow">콘셉트 카페</div>
              <h1>카페 목록</h1>
              <p>콘카에 등록된 카페를 둘러보세요. 카페를 누르면 영업 정보와 함께 캐스트 스케줄, 지도 위치로 이동할 수 있습니다.</p>
            </div>

            <aside class="surface hero-meta">
              <div class="stat-list">
                <div class="stat">
                  <span class="stat-label">전체 카페</span>
                  <strong class="stat-value" id="cafeCount">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">검색 결과</span>
                  <strong class="stat-value" id="filteredCount">0</strong>
                </div>
              </div>
              <a class="button button-secondary" href="/map">지도에서 카페 찾기</a>
            </aside>
          </section>

          <section class="surface section" style="margin-top: 20px;">
            <div class="section-header">
              <div>
                <h2>카페 목록</h2>
                <p>국가와 도시를 고르고, 이름·주소 검색이나 컨셉으로 좁혀 볼 수 있습니다.</p>
              </div>
            </div>
            <div id="cafeFilter"></div>
            <div class="cafe-grid" id="cafeGrid"></div>
            <p class="empty" id="cafeEmptyState">카페 목록을 불러오는 중입니다.</p>
          </section>
        </div>
        <footer class="footer">
          <span>© 2026 콘카(ConCafe)</span>
          <span><a href="/privacy">개인정보처리방침</a></span>
        </footer>
      </main>
    </div>

    <!-- 카페 정보 모달 -->
    <div class="admin-modal" id="cafeModal" role="dialog" aria-modal="true" aria-labelledby="cafeModalTitle" hidden>
      <div class="admin-modal-box" style="max-width: 600px;">
        <button class="admin-modal-close" type="button" data-close-modal aria-label="닫기">✕</button>
        <div class="cafe-detail-head">
          <div class="cafe-detail-thumb" id="cafeModalThumb"></div>
          <div>
            <div class="chip-row" id="cafeModalChips"></div>
            <h2 id="cafeModalTitle" style="margin: 10px 0 6px;"></h2>
            <dl class="cafe-info-list" id="cafeModalInfo"></dl>
          </div>
        </div>
        <div class="cafe-gallery-strip" id="cafeModalGallery"></div>
        <div class="button-row" style="margin-top: 20px;">
          <a class="button button-primary" id="cafeModalScheduleLink" href="/schedule">캐스트 스케줄 보기</a>
          <a class="button button-secondary" id="cafeModalMapLink" href="/map">지도에서 보기</a>
        </div>
      </div>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-common.js"></script>
    <script src="/assets/js/cafe-list-filter.js"></script>
    <script>
      (function () {
        const A = window.ConcafeAdmin;
        const escapeHtml = A.escapeHtml;
        const state = { cafes: [], loaded: false };
        const el = {};
        [
          "cafeCount", "filteredCount", "cafeFilter", "cafeGrid", "cafeEmptyState",
          "cafeModal", "cafeModalThumb", "cafeModalChips", "cafeModalTitle", "cafeModalInfo", "cafeModalGallery",
          "cafeModalScheduleLink", "cafeModalMapLink",
        ].forEach(function (id) { el[id] = document.getElementById(id); });

        const filter = window.ConcafeCafeList.createFilter({
          mount: el.cafeFilter,
          searchPlaceholder: "카페 이름 또는 주소로 검색",
          searchStorageKey: "concafe.cafes.search",
          regionStorageKey: "concafe.cafes.region",
          detectCountry: true,
          onChange: renderCafeGrid,
        });

        // 관리자 카페 목록과 같은 카드 그리드를 쓴다 (승인된 카페만 노출)
        function renderCafeGrid() {
          const filtered = filter.apply(state.cafes);
          el.cafeCount.textContent = String(state.cafes.length);
          el.filteredCount.textContent = String(filtered.length);

          if (!filtered.length) {
            el.cafeGrid.innerHTML = "";
            el.cafeEmptyState.style.display = "";
            el.cafeEmptyState.textContent = !state.loaded ? "카페 목록을 불러오는 중입니다."
              : !state.cafes.length ? "등록된 카페가 없습니다."
              : filter.emptyMessage();
            return;
          }
          el.cafeEmptyState.style.display = "none";
          el.cafeGrid.innerHTML = filtered.map(function (cafe) {
            return window.ConcafeCafeList.cardHtml(cafe, { href: "#cafe=" + encodeURIComponent(cafe.id) });
          }).join("");
        }

        // ---------- 카페 정보 모달 ----------

        function openCafeModal(cafeId) {
          const cafe = state.cafes.find(function (item) { return item.id === cafeId; });
          if (!cafe) {
            return;
          }
          el.cafeModalTitle.textContent = cafe.name;
          el.cafeModalThumb.innerHTML = A.cafeThumbHtml(cafe);
          const concept = A.conceptLabel(cafe.conceptType);
          el.cafeModalChips.innerHTML = concept ? '<span class="chip">' + escapeHtml(concept) + "</span>" : "";
          const rows = [
            ["지역", [A.COUNTRY_LABELS[cafe.country] || cafe.country, A.cityLabel(cafe.country, cafe.city)].filter(Boolean).join(" · ")],
            ["주소", cafe.address],
            ["전화번호", cafe.phoneNumber],
            ["영업시간", cafe.businessHours],
            ["소개", cafe.desc],
          ].filter(function (row) { return row[1]; });
          el.cafeModalInfo.innerHTML = rows.map(function (row) {
            return "<dt>" + escapeHtml(row[0]) + "</dt><dd>" + escapeHtml(row[1]) + "</dd>";
          }).join("");
          el.cafeModalGallery.innerHTML = cafe.galleryImages.filter(function (url) {
            return url !== cafe.thumbnailImage;
          }).map(function (url) {
            return '<img src="' + escapeHtml(url) + '" alt="" loading="lazy" />';
          }).join("");
          el.cafeModalScheduleLink.href = "/schedule?cafeId=" + encodeURIComponent(cafe.id);
          el.cafeModalMapLink.href = "/map?cafeId=" + encodeURIComponent(cafe.id);
          el.cafeModalMapLink.hidden = cafe.lat == null || cafe.lng == null;
          el.cafeModal.hidden = false;
          el.cafeModal.querySelector(".admin-modal-close").focus();
        }

        function closeCafeModal() {
          if (el.cafeModal.hidden) {
            return;
          }
          el.cafeModal.hidden = true;
          if (/^#cafe=/.test(window.location.hash)) {
            history.replaceState(null, "", window.location.pathname + window.location.search);
          }
        }

        function syncModalWithHash() {
          const match = /^#cafe=(.+)$/.exec(window.location.hash);
          if (match) {
            openCafeModal(decodeURIComponent(match[1]));
          } else {
            closeCafeModal();
          }
        }

        // ---------- 불러오기 ----------

        async function loadCafes() {
          try {
            const snapshot = await A.db.collection("cafes").where("approved", "==", true).get();
            state.cafes = snapshot.docs.map(A.toCafe).sort(function (a, b) {
              return a.name.localeCompare(b.name, "ko");
            });
            state.loaded = true;
            filter.setCafes(state.cafes);
          } catch (error) {
            console.error(error);
            state.loaded = true;
            window.ConcafeToast.show("error", "카페 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.");
          }
          renderCafeGrid();
          syncModalWithHash();
        }

        // ---------- 이벤트 연결 ----------

        window.addEventListener("hashchange", syncModalWithHash);
        el.cafeModal.addEventListener("click", function (e) {
          if (e.target === el.cafeModal || e.target.closest("[data-close-modal]")) {
            closeCafeModal();
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeCafeModal();
          }
        });

        renderCafeGrid();
        A.initAuthWidget(null);
        loadCafes();
      })();
    </script>
    <script src="/assets/js/admin-nav.js"></script>
  </body>
</html>
