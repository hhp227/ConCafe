<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="naver-site-verification" content="2f55d1084319a920c87309b4aedc950a47e20453" />
    <meta name="google-site-verification" content="_zyYEXK-zNirfz9DIJOK5zphnDyGWwfN4wykoKzYvQI" />
    <title>카페 목록 · 콘카</title>
    <meta name="description" content="콘카에 등록된 메이드·집사·아이돌 등 콘셉트 카페 목록을 한눈에 보고, 캐스트 스케줄과 지도 위치를 확인할 수 있습니다." />
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/cafes">
            <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />
            <span class="brand-title" aria-label="콘셉카페">
              <span class="brand-main">콘</span><span class="brand-sub">셉</span><span class="brand-main">카</span><span class="brand-sub">페</span>
            </span>
          </a>
          <div class="topbar-right">
            <nav class="nav-links app-nav" aria-label="주요 메뉴">
              <a class="nav-link" href="/cafes">카페 목록</a>
              <a class="nav-link" href="/map">컨셉 카페 지도</a>
              <a class="nav-link" href="/community">커뮤니티</a>
            </nav>
            <div class="auth-widget" id="authWidget">
              <div class="auth-user-info" id="authUserInfo" style="display:none;">
                <img class="auth-user-photo" id="authUserPhoto" src="" alt="프로필" />
                <span class="auth-user-name" id="authUserName"></span>
                <button class="auth-btn signout" id="signOutBtn" type="button">로그아웃</button>
              </div>
              <button class="auth-btn" id="signInBtn" type="button">로그인</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container">
        <div class="page">
          <section class="hero">
            <div class="surface hero-copy">
              <div class="eyebrow">콘셉트 카페</div>
              <h1>카페 목록</h1>
              <p>콘카에 등록된 카페를 둘러보세요. 카페를 누르면 영업 정보, 캐스트, 이벤트, 메뉴를 볼 수 있는 상세 페이지로 이동합니다.</p>
            </div>

            <aside class="surface hero-meta">
              <div class="stat-list">
                <div class="stat">
                  <span class="stat-label">전체 카페</span>
                  <strong class="stat-value" id="cafeCount">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">검색 결과</span>
                  <strong class="stat-value" id="filteredCount">0</strong>
                </div>
              </div>
              <!-- 관리자는 '카페 등록', 그 밖에는 '지도에서 카페 찾기' -->
              <a class="button button-secondary" id="heroActionLink" href="/map">지도에서 카페 찾기</a>
            </aside>
          </section>

          <section class="surface section" style="margin-top: 20px;">
            <div class="section-header">
              <div>
                <h2>카페 목록</h2>
                <p id="cafeSectionNote">국가와 도시를 고르고, 이름·주소 검색이나 컨셉으로 좁혀 볼 수 있습니다.</p>
              </div>
            </div>
            <div id="cafeFilter"></div>
            <div class="cafe-grid" id="cafeGrid"></div>
            <p class="empty" id="cafeEmptyState">카페 목록을 불러오는 중입니다.</p>
          </section>
        </div>
        <footer class="footer">
          <span>© 2026 콘카(ConCafe)</span>
          <div class="footer-links">
            <a href="/privacy">개인정보처리방침</a>
            <div class="footer-store">
              <a href="https://play.google.com/store/apps/details?id=com.hhp227.concafe" target="_blank" rel="noreferrer">
                <img src="/assets/images/googleplay.png" alt="Google Play에서 다운로드" width="130" height="40" />
              </a>
              <a href="https://apps.apple.com/kr/app/%EC%BD%98%EC%B9%B4/id6761295445" target="_blank" rel="noreferrer">
                <img src="/assets/images/appleappstore.png" alt="App Store에서 다운로드" width="130" height="40" />
              </a>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-common.js"></script>
    <script src="/assets/js/cafe-list-filter.js"></script>
    <script>
      (function () {
        const A = window.ConcafeAdmin;
        // 관리자로 로그인하면 미승인 카페까지 함께 보여주고 '카페 등록' 버튼을 띄운다 (예전 /admin 카페 관리 목록을 합쳤다)
        const state = { cafes: [], loaded: false, isAdmin: false, loadSeq: 0 };
        const el = {};
        [
          "cafeCount", "filteredCount", "cafeFilter", "cafeGrid", "cafeEmptyState", "heroActionLink", "cafeSectionNote",
        ].forEach(function (id) { el[id] = document.getElementById(id); });

        const filter = window.ConcafeCafeList.createFilter({
          mount: el.cafeFilter,
          searchPlaceholder: "카페 이름 또는 주소로 검색",
          searchStorageKey: "concafe.cafes.search",
          regionStorageKey: "concafe.cafes.region",
          detectCountry: true,
          onChange: renderCafeGrid,
        });

        function renderCafeGrid() {
          const filtered = filter.apply(state.cafes);
          el.cafeCount.textContent = String(state.cafes.length);
          el.filteredCount.textContent = String(filtered.length);

          if (!filtered.length) {
            el.cafeGrid.innerHTML = "";
            el.cafeEmptyState.style.display = "";
            el.cafeEmptyState.textContent = !state.loaded ? "카페 목록을 불러오는 중입니다."
              : !state.cafes.length ? (state.isAdmin ? "등록된 카페가 없습니다. 카페 등록 버튼으로 추가하세요." : "등록된 카페가 없습니다.")
              : filter.emptyMessage();
            return;
          }
          el.cafeEmptyState.style.display = "none";
          el.cafeGrid.innerHTML = filtered.map(function (cafe) {
            return window.ConcafeCafeList.cardHtml(cafe, {
              href: "/cafe?id=" + encodeURIComponent(cafe.id),
              extraChipsHtml: cafe.approved ? "" : '<span class="chip warning">미승인</span>',
            });
          }).join("");
        }

        function renderRoleUi() {
          if (state.isAdmin) {
            el.heroActionLink.textContent = "+ 카페 등록";
            el.heroActionLink.href = "/admin-cafe-new";
            el.heroActionLink.className = "button button-primary";
            el.cafeSectionNote.textContent = "관리자에게는 미승인 카페도 함께 보입니다. 카페를 눌러 상세 정보와 관리 메뉴로 이동하세요.";
          } else {
            el.heroActionLink.textContent = "지도에서 카페 찾기";
            el.heroActionLink.href = "/map";
            el.heroActionLink.className = "button button-secondary";
            el.cafeSectionNote.textContent = "국가와 도시를 고르고, 이름·주소 검색이나 컨셉으로 좁혀 볼 수 있습니다.";
          }
        }

        // ---------- 불러오기 ----------

        async function loadCafes() {
          const seq = ++state.loadSeq;
          try {
            const query = state.isAdmin
              ? A.db.collection("cafes")
              : A.db.collection("cafes").where("approved", "==", true);
            const snapshot = await query.get();
            if (seq !== state.loadSeq) return;
            state.cafes = snapshot.docs.map(A.toCafe).sort(function (a, b) {
              return a.name.localeCompare(b.name, "ko");
            });
            state.loaded = true;
            filter.setCafes(state.cafes);
          } catch (error) {
            if (seq !== state.loadSeq) return;
            console.error(error);
            state.loaded = true;
            window.ConcafeToast.show("error", "카페 목록을 불러오지 못했습니다. 잠시 후 다시 시도하세요.");
          }
          renderCafeGrid();
        }

        // ---------- 시작 ----------

        // 예전 모달 주소(#cafe=ID)로 들어오면 카페 상세 페이지로 보낸다
        const legacyHash = /^#cafe=(.+)$/.exec(window.location.hash);
        if (legacyHash) {
          window.location.replace("/cafe?id=" + encodeURIComponent(decodeURIComponent(legacyHash[1])));
          return;
        }

        renderCafeGrid();
        // 로그인 상태를 확인한 뒤 한 번 불러온다 (관리자면 전체, 아니면 승인된 카페만)
        A.initAuthWidget(async function (user) {
          let isAdmin = false;
          try {
            isAdmin = (await A.fetchUserAccess(user)).isAdmin;
          } catch (error) {
            console.error(error);
          }
          if (state.loaded && isAdmin === state.isAdmin) {
            return;
          }
          state.isAdmin = isAdmin;
          renderRoleUi();
          loadCafes();
        });
      })();
    </script>
    <script src="/assets/js/admin-nav.js"></script>
  </body>
</html>
