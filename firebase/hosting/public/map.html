<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>콘카 | 컨셉 카페 지도</title>
  <meta
          name="description"
          content="콘카 컨셉 카페 지도로 실제 카페 위치를 전체 화면 지도에서 검색하고 확인하세요."
  />
  <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
    }

    .map-page {
      height: calc(100dvh - 65px);
      min-height: 640px;
      position: relative;
    }

    .map-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 400px minmax(0, 1fr);
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 228, 239, 0.95) 0%, rgba(255, 248, 251, 0) 44%),
        linear-gradient(180deg, #fffdfd 0%, var(--bg) 30%, #fff6fa 100%);
    }

    .map-sidebar {
      position: relative;
      z-index: 4;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0;
      min-height: 0;
      background: rgba(255, 251, 252, 0.97);
      border-right: 1px solid rgba(243, 217, 228, 0.86);
      box-shadow: 18px 0 36px rgba(74, 54, 69, 0.08);
    }

    .map-canvas {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-empty {
      position: absolute;
      inset: 24px;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px dashed #f0b7ce;
      color: #7d5e6d;
      backdrop-filter: blur(10px);
    }

    .map-empty.is-visible {
      display: flex;
    }

    .map-empty-card {
      width: min(320px, 100%);
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .map-empty-spinner {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 4px solid rgba(239, 103, 151, 0.16);
      border-top-color: var(--primary);
      animation: map-spinner 0.85s linear infinite;
    }

    .map-empty-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }

    .map-empty-message {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .map-empty-progress {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(239, 103, 151, 0.14);
    }

    .map-empty-progress-bar {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary) 0%, #f8a8c3 100%);
      animation: map-progress 1.3s ease-in-out infinite;
      transform: translateX(-120%);
    }

    .map-empty.is-error .map-empty-spinner,
    .map-empty.is-error .map-empty-progress {
      display: none;
    }

    @keyframes map-spinner {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes map-progress {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(320%);
      }
    }

    .toolbar-card {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(243, 217, 228, 0.82);
      display: grid;
      gap: 12px;
    }

    .toolbar-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .toolbar-title {
      display: grid;
      gap: 4px;
    }

    .toolbar-title strong {
      font-size: 20px;
      line-height: 1.1;
    }

    .toolbar-title span {
      font-size: 13px;
      color: var(--muted);
    }

    .toolbar-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      padding: 10px 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .search-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .search-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .search-input {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid #f0d6e1;
      border-radius: 16px;
      background: #fff8fb;
      font: inherit;
      color: var(--text);
    }

    .search-button,
    .ghost-button,
    .map-icon-button,
    .result-button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .search-button,
    .ghost-button {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 16px;
      font-weight: 700;
    }

    .search-button {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
      color: #fff;
    }

    .ghost-button {
      background: #fff;
      color: var(--primary-strong);
      border: 1px solid #f0d6e1;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .filter-select {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid #f0d6e1;
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .results-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }

    .results-head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid rgba(243, 217, 228, 0.82);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .results-head strong {
      display: block;
      font-size: 18px;
    }

    .results-head span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .results-list {
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px 16px;
      display: grid;
      gap: 10px;
    }

    .result-button {
      width: 100%;
      text-align: left;
      padding: 14px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #f2d4df;
      color: inherit;
    }

    .result-button.is-active {
      border-color: #eb8fb1;
      background: #fff4f8;
      box-shadow: inset 0 0 0 1px rgba(239, 103, 151, 0.16);
    }

    .result-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .result-button strong {
      display: block;
      font-size: 15px;
    }

    .result-button p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status-pill {
      flex: 0 0 auto;
      padding: 6px 8px;
      border-radius: 999px;
      background: #fff1f7;
      color: var(--primary-strong);
      font-size: 11px;
      font-weight: 700;
    }

    .map-actions {
      position: absolute;
      right: 18px;
      bottom: 76px;
      z-index: 5;
      display: grid;
      gap: 10px;
    }

    .map-style-control {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      width: 150px;
    }

    .map-style-select {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border: 1px solid rgba(243, 217, 228, 0.9);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      font: inherit;
      box-shadow: 0 18px 34px rgba(74, 54, 69, 0.16);
      backdrop-filter: blur(10px);
    }

    .map-icon-button {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      font-size: 22px;
      box-shadow: 0 18px 34px rgba(74, 54, 69, 0.18);
    }

    .map-credit {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 4;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(243, 217, 228, 0.84);
      box-shadow: 0 18px 34px rgba(74, 54, 69, 0.12);
      font-size: 12px;
      color: var(--muted);
    }

    .map-detail-panel {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 20;
      width: 360px;
      background: #fff;
      border-left: 1px solid rgba(243, 217, 228, 0.86);
      box-shadow: -18px 0 36px rgba(74, 54, 69, 0.14);
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      visibility: hidden;
      pointer-events: none;
    }

    .map-detail-panel.is-open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
    }

    .detail-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #f0d6e1;
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      backdrop-filter: blur(6px);
      touch-action: manipulation;
    }

    .detail-image-wrap {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #fff1f7 0%, #ffe4ef 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .detail-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-image-placeholder {
      font-size: 52px;
      opacity: 0.6;
    }

    .detail-content {
      padding: 18px 18px 28px;
      flex: 1;
    }

    .detail-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff1f7;
      color: var(--primary-strong);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .detail-name {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .detail-address {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .detail-divider {
      border: 0;
      border-top: 1px solid #f2d4df;
      margin: 0 0 14px;
    }

    .detail-note {
      font-size: 13px;
      color: #5f5262;
      line-height: 1.75;
      white-space: pre-line;
    }

    /* ── Topbar right group ── */
    .topbar-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    /* ── Auth widget ── */
    .auth-widget { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* ── Auth modal ── */
    .auth-modal {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(35, 22, 28, 0.48); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .auth-modal.is-open { opacity: 1; pointer-events: auto; }
    .auth-modal-box {
      position: relative; background: #fff; border-radius: 20px;
      padding: 32px 28px; width: calc(100% - 32px); max-width: 360px;
      box-shadow: 0 8px 40px rgba(74, 54, 69, 0.22);
      transform: translateY(16px); transition: transform 0.2s;
    }
    .auth-modal.is-open .auth-modal-box { transform: translateY(0); }
    .auth-modal-close {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: #a07a8f; line-height: 1; padding: 4px;
    }
    .auth-modal-close:hover { color: #3d2c38; }
    .auth-modal-title { font-size: 20px; font-weight: 800; color: #23161c; margin: 0 0 20px; }
    .auth-modal-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-modal-field { display: flex; flex-direction: column; gap: 5px; }
    .auth-modal-field label { font-size: 12px; font-weight: 700; color: #6d5d64; }
    .auth-modal-field input {
      padding: 10px 14px; border-radius: 12px;
      border: 1px solid #e7d9df; background: #fff8fb;
      font: inherit; font-size: 14px; color: #23161c; outline: none;
    }
    .auth-modal-field input:focus { border-color: #ef6797; }
    .auth-modal-error { font-size: 12px; color: #c4415f; margin: 0; }
    .auth-modal-submit {
      margin-top: 4px; padding: 12px; border-radius: 14px;
      background: linear-gradient(135deg, #ef6797, #da4e84);
      color: #fff; border: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .auth-modal-submit:hover { background: linear-gradient(135deg, #da4e84, #c73d73); }
    .auth-modal-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 16px 0; color: #a07a8f; font-size: 12px;
    }
    .auth-modal-divider::before, .auth-modal-divider::after {
      content: ""; flex: 1; height: 1px; background: #e7d9df;
    }
    .auth-modal-google {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 11px; border-radius: 14px;
      border: 1px solid #e7d9df; background: #fff;
      font: inherit; font-size: 13px; font-weight: 700; color: #3d2c38; cursor: pointer;
    }
    .auth-modal-google:hover { background: #fdf8fa; border-color: #cfb8c2; }
    .auth-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid rgba(239, 103, 151, 0.5);
      background: #fff1f7; color: #9d2759;
      font: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .auth-btn:hover { background: #ffe4ef; }
    .auth-btn.signout {
      background: transparent; border-color: rgba(207, 184, 194, 0.5);
      color: #6d5d64; font-weight: 400; font-size: 12px; padding: 6px 12px;
    }
    .auth-user-info { display: flex; align-items: center; gap: 6px; }
    .auth-user-photo {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; border: 1.5px solid rgba(239, 103, 151, 0.4); flex-shrink: 0;
    }
    .auth-user-name {
      font-size: 13px; font-weight: 700; color: #23161c;
      max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Reviews ── */
    .detail-reviews { padding: 0; }
    .reviews-head { margin-bottom: 10px; }
    .reviews-head strong { font-size: 14px; color: #3d2c38; }
    .review-card {
      padding: 12px; border-radius: 12px;
      background: #fff9fb; border: 1px solid #f2d4df; margin-bottom: 10px;
    }
    .review-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .review-user-photo {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; background: #f2d4df; flex-shrink: 0;
      border: 1px solid #f0d6e1;
    }
    .review-user-name { font-size: 12px; font-weight: 700; color: #3d2c38; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .review-stars { color: #f0a500; font-size: 12px; letter-spacing: 1px; }
    .review-date { font-size: 11px; color: #a07a8f; flex-shrink: 0; }
    .review-content { font-size: 13px; color: #5f5262; line-height: 1.6; margin-bottom: 4px; }
    .review-img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; margin-top: 4px; }
    .reviews-empty { text-align: center; color: #a07a8f; font-size: 13px; padding: 10px 0; margin: 0; }
    .review-form-head { font-size: 13px; font-weight: 700; color: #3d2c38; margin-bottom: 10px; display: block; }
    .star-input { display: flex; gap: 2px; margin-bottom: 10px; }
    .star-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: #ddd; padding: 0; line-height: 1; transition: color 0.1s; }
    .star-btn.active { color: #f0a500; }
    .review-textarea {
      width: 100%; min-height: 72px; padding: 10px 12px;
      border: 1px solid #f0d6e1; border-radius: 12px;
      background: #fff8fb; font: inherit; font-size: 13px; color: #3d2c38;
      resize: vertical; box-sizing: border-box; margin-bottom: 10px;
    }
    .review-textarea:focus { outline: none; border-color: #ef6797; }
    .image-upload-label {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 12px;
      background: #fff1f7; border: 1px dashed #f0b7ce;
      color: #9d2759; font-size: 12px; font-weight: 700; cursor: pointer;
      margin-bottom: 8px;
    }
    .review-img-preview { width: 100%; max-height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid #f0d6e1; margin-bottom: 10px; display: block; }
    .submit-review-btn {
      width: 100%; padding: 11px; border-radius: 14px;
      background: linear-gradient(135deg, #ef6797, #da4e84);
      color: #fff; border: none; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .submit-review-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .review-status { margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: 12px; }
    .review-status.success { background: #ebfff6; color: #1f8b5f; border: 1px solid #b8e7d1; }
    .review-status.error { background: #fff0f3; color: #c4415f; border: 1px solid #f1b7c4; }
    .review-login-box {
      padding: 14px; text-align: center;
      background: #fff9fb; border-radius: 12px; border: 1px dashed #f0b7ce; margin-top: 10px;
    }
    .review-login-box p { font-size: 12px; color: #7d5e6d; margin: 0 0 8px; }
    .review-login-cta {
      padding: 7px 18px; border-radius: 20px;
      background: linear-gradient(135deg, #ef6797, #da4e84);
      color: #fff; border: none; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 920px) {
      .map-page {
        height: calc(100dvh - 61px);
        min-height: 0;
      }

      .map-stage {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(300px, 52dvh) minmax(320px, 1fr);
      }

      .map-sidebar {
        order: 2;
        border-right: 0;
        border-top: 1px solid rgba(243, 217, 228, 0.86);
        box-shadow: 0 -18px 36px rgba(74, 54, 69, 0.08);
      }

      .map-canvas {
        order: 1;
      }

      .toolbar-head {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .toolbar-badge {
        min-width: 0;
      }

      .search-bar {
        grid-template-columns: 1fr;
      }

      .search-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .results-panel {
        min-height: 0;
      }

      .results-head {
        align-items: stretch;
        flex-direction: column;
      }

      .results-head .ghost-button {
        width: 100%;
      }

      .map-credit {
        display: none;
      }

      .map-actions {
        right: 14px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      }

      .map-style-control {
        right: 14px;
        top: 14px;
        bottom: auto;
        width: 132px;
      }

      .map-empty {
        inset: 14px;
      }

      .map-detail-panel {
        width: 100%;
        right: 0;
        left: 0;
        top: 12px;
        bottom: 0;
        height: auto;
        transform: translateY(100%);
        border-left: 0;
        border-top: 1px solid rgba(243, 217, 228, 0.86);
        box-shadow: 0 -18px 36px rgba(74, 54, 69, 0.14);
        border-radius: 24px 24px 0 0;
      }

      .map-detail-panel.is-open {
        transform: translateY(0);
      }

      .detail-close-btn {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        right: 14px;
      }

      .detail-image-wrap {
        height: 150px;
      }
    }

    @media (max-width: 640px) {
      .toolbar-card {
        padding: 16px 14px 14px;
      }

      .results-head {
        padding: 14px;
      }

      .results-list {
        padding: 10px 12px 14px;
      }

      .search-actions {
        grid-template-columns: 1fr;
      }

      .map-style-control {
        left: 14px;
        right: 78px;
        width: auto;
      }

      .map-actions {
        right: 14px;
      }
    }
  </style>
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeText(value) {
      return typeof value === "string" ? value.trim() : "";
    }

    function normalizeRegionLabel(region) {
      if (!region || typeof region !== "object") {
        return "";
      }

      const parts = [
        normalizeText(region.prefecture),
        normalizeText(region.city),
        normalizeText(region.district),
      ].filter(Boolean);

      if (parts.length > 0) {
        return parts.join(" ");
      }

      return normalizeText(region.address);
    }

    function pickRegionFilter(region) {
      const parts = [
        normalizeText(region && region.prefecture),
        normalizeText(region && region.city),
        normalizeText(region && region.district),
        normalizeText(region && region.address),
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      if (parts.indexOf("seoul") !== -1 || parts.indexOf("서울") !== -1 || parts.indexOf("ソウル") !== -1) {
        return "서울";
      }
      if (parts.indexOf("busan") !== -1 || parts.indexOf("부산") !== -1 || parts.indexOf("釜山") !== -1) {
        return "부산";
      }
      if (parts.indexOf("daegu") !== -1 || parts.indexOf("대구") !== -1 || parts.indexOf("大邱") !== -1) {
        return "대구";
      }
      if (parts.indexOf("tokyo") !== -1 || parts.indexOf("도쿄") !== -1 || parts.indexOf("東京") !== -1) {
        return "도쿄";
      }
      if (parts.indexOf("osaka") !== -1 || parts.indexOf("오사카") !== -1 || parts.indexOf("大阪") !== -1) {
        return "오사카";
      }
      if (parts.indexOf("yokohama") !== -1 || parts.indexOf("요코하마") !== -1 || parts.indexOf("横浜") !== -1) {
        return "요코하마";
      }

      return "전체";
    }

    function resolveGeoPoint(region) {
      if (!region || typeof region !== "object") {
        return null;
      }

      const location = region.location;
      if (location && typeof location === "object") {
        if (typeof location.latitude === "number" && typeof location.longitude === "number") {
          return { lat: location.latitude, lng: location.longitude };
        }
        if (typeof location._lat === "number" && typeof location._long === "number") {
          return { lat: location._lat, lng: location._long };
        }
      }

      return null;
    }

    function buildCafeModel(doc) {
      const data = doc.data() || {};
      const region = data.region && typeof data.region === "object" ? data.region : {};
      const point = resolveGeoPoint(region);
      if (!point || data.approved !== true) {
        return null;
      }

      const conceptType = normalizeText(data.conceptType);
      const desc = normalizeText(data.desc);
      const businessHours = normalizeText(data.businessHours);
      const regionLabel = normalizeRegionLabel(region);

      return {
        id: doc.id,
        name: normalizeText(data.name) || "이름 없는 카페",
        district: pickRegionFilter(region),
        regionLabel: regionLabel,
        address: normalizeText(region.address) || regionLabel || "주소 정보 없음",
        theme: conceptType || "메이드 카페",
        status: "운영중",
        note: desc || businessHours || "카페 상세 정보는 앱에서 확인할 수 있습니다.",
        lat: point.lat,
        lng: point.lng,
        image: normalizeText(data.thumbnailImage),
      };
    }

    function createMarkerIcon(isActive) {
      var color = isActive ? "#c73d73" : "#ef6797";
      var w = isActive ? 34 : 28;

        '<path d="M17 0C7.611 0 0 7.611 0 17c0 12.426 17 31 17 31S34 29.426 34 17C34 7.611 26.389 0 17 0z"' +
        ' fill="' + color + '" stroke="white" stroke-width="2.5"/>' +
        '<circle cx="17" cy="17" r="7" fill="white" fill-opacity="0.92"/>' +
        '</svg>';
      return {
        url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
        scaledSize: new window.google.maps.Size(w, h),
        anchor: new window.google.maps.Point(w / 2, h),
      };
    }

    function getFilteredCafes() {
      const keyword = state.appliedKeyword.toLowerCase();
      return state.cafes.filter(function (cafe) {
        const matchesDistrict = state.activeDistrict === "전체" || cafe.district === state.activeDistrict;
        const haystack = [cafe.name, cafe.address, cafe.theme, cafe.district, cafe.regionLabel].join(" ").toLowerCase();
        const matchesKeyword = keyword.length === 0 || haystack.indexOf(keyword) !== -1;
        return matchesDistrict && matchesKeyword;
      });
    }

    function syncRegionFilter() {
      if (el.regionFilter) {
        el.regionFilter.value = state.activeDistrict;
      }
    }

    function syncMapTypeFilter() {
      if (el.mapTypeFilter) {

    function loadSavedMapType() {
      try {
        const saved = window.localStorage.getItem(MAP_TYPE_STORAGE_KEY);
        if (saved === "roadmap" || saved === "satellite" || saved === "hybrid" || saved === "terrain") {
          state.mapTypeId = saved;
        }
      } catch (error) {
        console.warn("Failed to read saved map type", error);

    }

    function persistMapType() {
      try {
        window.localStorage.setItem(MAP_TYPE_STORAGE_KEY, state.mapTypeId);
      } catch (error) {
        console.warn("Failed to persist map type", error);
      }

    function renderList(filteredCafes) {
      if (!filteredCafes.some(function (cafe) { return cafe.id === state.activeCafeId; })) {
        state.activeCafeId = filteredCafes[0] ? filteredCafes[0].id : "";

      if (filteredCafes.length === 0) {

          '<article class="result-button" aria-live="polite">' +

      el.list.innerHTML = filteredCafes
        .map(function (cafe) {
          const activeClass = cafe.id === state.activeCafeId ? "result-button is-active" : "result-button";
          return (
            '<button class="' + activeClass + '" type="button" data-cafe-id="' + escapeHtml(cafe.id) + '">' +
            '<div class="result-top">' +
            "<div>" +
            "<strong>" + escapeHtml(cafe.name) + "</strong>" +
            "<p>" + escapeHtml(cafe.district) + " · " + escapeHtml(cafe.theme) + "<br />" + escapeHtml(cafe.address) + "</p>" +

            "</div>" +
            "</button>"
          );

      Array.from(el.list.querySelectorAll("[data-cafe-id]")).forEach(function (button) {

      el.resultsSubtitle.textContent = state.activeDistrict === "전체"

        : state.activeDistrict + " 지역 카페를 표시하고 있습니다.";
    }

    function getCafeById(cafeId) {
      return state.cafes.find(function (cafe) {
        return cafe.id === cafeId;
      }) || null;
    }

    function calculateDistanceMeters(from, to) {
      const earthRadius = 6371000;
      const toRadians = function (degrees) {
        return degrees * (Math.PI / 180);
      };

      const latDelta = toRadians(to.lat - from.lat);
      const lngDelta = toRadians(to.lng - from.lng);
      const fromLat = toRadians(from.lat);
      const toLat = toRadians(to.lat);
      const a =
        Math.sin(latDelta / 2) * Math.sin(latDelta / 2) +
        Math.cos(fromLat) * Math.cos(toLat) *
        Math.sin(lngDelta / 2) * Math.sin(lngDelta / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return earthRadius * c;
    }

    function resolveNearestCafe(location) {
      if (!location || state.cafes.length === 0) {
        return null;
      }

      let nearestCafe = null;
      let nearestDistance = Infinity;
      state.cafes.forEach(function (cafe) {
        const distance = calculateDistanceMeters(location, { lat: cafe.lat, lng: cafe.lng });
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestCafe = cafe;
        }
      });
      return nearestCafe;
    }

    function requestBrowserLocation() {
      return new Promise(function (resolve) {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (position) {
            resolve({
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            });
          },
          function () {
            resolve(null);
          },
          {
            enableHighAccuracy: true,
            timeout: 6000,
            maximumAge: 300000,
          }
        );
      });
    }

    async function applyNearestDistrictFromUserLocation() {
      const location = await requestBrowserLocation();
      state.userLocation = location;

      if (!location) {
        state.activeDistrict = "전체";
        if (state.cafes.length === 0) {
          el.mapHeaderCaption.textContent = "표시 가능한 카페 데이터가 없습니다.";
        }
        return;
      }

      const nearestCafe = resolveNearestCafe(location);
      if (!nearestCafe) {
        return;
      }

      state.activeDistrict = nearestCafe.district || "전체";
      state.activeCafeId = nearestCafe.id;
      el.mapHeaderCaption.textContent =
        "현재 위치 기준 가까운 지역은 " + state.activeDistrict + " 입니다.";
    }

    function fitMapToCafes(cafesToFit) {
      if (!map || !window.google || !window.google.maps || cafesToFit.length === 0) {
        return;
      }

      const bounds = new window.google.maps.LatLngBounds();
      cafesToFit.forEach(function (cafe) {
        bounds.extend({ lat: cafe.lat, lng: cafe.lng });
      });
      map.fitBounds(bounds, 80);
    }

    function openInfoWindow(cafe) {
      if (!map || !infoWindow || !cafe) {
        return;
      }

      const marker = markers.get(cafe.id);
      if (!marker) {
        return;
      }

      infoWindow.setContent(
        '<div style="min-width:210px;padding:4px 2px 2px;">' +
          '<strong style="display:block;font-size:14px;color:#3d2c38;">' + escapeHtml(cafe.name) + "</strong>" +
          '<div style="margin-top:4px;font-size:12px;color:#7a6f7c;">' + escapeHtml(cafe.district) + " · " + escapeHtml(cafe.theme) + "</div>" +
          '<div style="margin-top:5px;font-size:12px;color:#5f5262;">' + escapeHtml(cafe.address) + "</div>" +
          '<button onclick="window.__concafeShowDetail(\'' + cafe.id + '\')" ' +
            'style="margin-top:10px;width:100%;padding:8px 0;background:linear-gradient(135deg,#ef6797,#da4e84);' +
            'color:#fff;border:0;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;">' +
            '자세히 보기 →' +
          "</button>" +
        "</div>"
      );
      infoWindow.open({ map: map, anchor: marker });
    }

    function refreshMarkers(filteredCafes) {
      markers.forEach(function (marker, cafeId) {
        const visible = filteredCafes.some(function (cafe) {
          return cafe.id === cafeId;
        });
        marker.setVisible(visible);
        if (window.google && window.google.maps) {
          marker.setIcon(createMarkerIcon(cafeId === state.activeCafeId));
        }
      });

      const activeCafe = getCafeById(state.activeCafeId);
      if (activeCafe && filteredCafes.some(function (cafe) { return cafe.id === activeCafe.id; })) {
        openInfoWindow(activeCafe);
      } else if (infoWindow) {
        infoWindow.close();
      }
    }

    function selectCafe(cafeId, panToMarker) {
      state.activeCafeId = cafeId;
      const filteredCafes = getFilteredCafes();
      renderList(filteredCafes);
      updateSummary(filteredCafes);
      refreshMarkers(filteredCafes);

      const cafe = getCafeById(cafeId);
      if (map && cafe && panToMarker) {
        map.panTo({ lat: cafe.lat, lng: cafe.lng });
        map.setZoom(Math.max(map.getZoom() || 15, 15));
      }
    }

    function syncUI() {
      const filteredCafes = getFilteredCafes();
      renderList(filteredCafes);
      updateSummary(filteredCafes);
      if (map) {
        refreshMarkers(filteredCafes);
      }
      return filteredCafes;
    }

    function applySearch() {
      state.appliedKeyword = normalizeText(el.searchInput.value);
      const filteredCafes = syncUI();
      fitMapToCafes(filteredCafes);
    }

    function resetSearch() {
      el.searchInput.value = "";
      state.appliedKeyword = "";
      state.activeDistrict = "전체";
      syncRegionFilter();
      const filteredCafes = syncUI();
      fitMapToCafes(filteredCafes);
    }

    function bindUI() {
      el.searchButton.addEventListener("click", applySearch);
      el.searchInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          applySearch();
        }
      });
      el.regionFilter.addEventListener("change", function () {
        state.activeDistrict = el.regionFilter.value || "전체";
        applySearch();
      });
      el.mapTypeFilter.addEventListener("change", function () {
        state.mapTypeId = el.mapTypeFilter.value || "roadmap";
        syncMapTypeFilter();
        persistMapType();
        if (map) {
          map.setMapTypeId(state.mapTypeId);
        }
      });
      el.resetButton.addEventListener("click", resetSearch);
      el.detailCloseBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        closeDetailPanel();
      });
      window.__concafeShowDetail = function (cafeId) {
        openDetailPanel(getCafeById(cafeId));
      };

      // Auth
      var googleProvider = new firebase.auth.GoogleAuthProvider();
      var authModal = document.getElementById("authModal");
      var authModalClose = document.getElementById("authModalClose");
      var emailLoginForm = document.getElementById("emailLoginForm");
      var emailLoginError = document.getElementById("emailLoginError");
      var googleSignInModalBtn = document.getElementById("googleSignInModalBtn");

      function openAuthModal() { authModal.classList.add("is-open"); }
      function closeAuthModal() {
        authModal.classList.remove("is-open");
        emailLoginError.style.display = "none";
        emailLoginForm.reset();
      }

      auth.onAuthStateChanged(function (user) {
        updateAuthWidget(user);
        if (user) closeAuthModal();
      });
      el.signInBtn.addEventListener("click", openAuthModal);
      authModalClose.addEventListener("click", closeAuthModal);
      authModal.addEventListener("click", function (e) { if (e.target === authModal) closeAuthModal(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAuthModal(); });

      emailLoginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("loginEmail").value.trim();
        var password = document.getElementById("loginPassword").value;
        emailLoginError.style.display = "none";
        auth.signInWithEmailAndPassword(email, password).catch(function (err) {
          emailLoginError.textContent = err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found"
            ? "이메일 또는 비밀번호가 올바르지 않습니다."
            : "로그인에 실패했습니다: " + err.message;
          emailLoginError.style.display = "block";
        });
      });
      googleSignInModalBtn.addEventListener("click", function () {
        auth.signInWithPopup(googleProvider).catch(function (err) {
          emailLoginError.textContent = "Google 로그인 실패: " + err.message;
          emailLoginError.style.display = "block";
        });
      });

      el.signOutBtn.addEventListener("click", function () {
        auth.signOut();
      });

      // Reviews - star rating
      el.starBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          reviewRating = parseInt(btn.dataset.value, 10);
          updateStarDisplay();
        });
        btn.addEventListener("mouseover", function () {
          var val = parseInt(btn.dataset.value, 10);
          el.starBtns.forEach(function (b, i) { b.classList.toggle("active", i < val); });
        });
      });
      document.getElementById("starInput").addEventListener("mouseleave", function () {
        updateStarDisplay();
      });

      // Reviews - image picker
      el.reviewImageFile.addEventListener("change", function () {
        reviewImageFile = el.reviewImageFile.files[0] || null;
        if (reviewImageFile) {
          var reader = new FileReader();
          reader.onload = function (e) {
            el.reviewImagePreview.innerHTML = '<img class="review-img-preview" src="' + e.target.result + '" alt="미리보기" />';
          };
          reader.readAsDataURL(reviewImageFile);
        } else {
          el.reviewImagePreview.innerHTML = "";
        }
      });

      // Reviews - submit
      el.submitReviewBtn.addEventListener("click", handleReviewSubmit);

      // Reviews - login CTA in prompt
      el.reviewLoginBtn.addEventListener("click", openAuthModal);
      el.fitAllButton.addEventListener("click", function () {
        fitMapToCafes(getFilteredCafes());
      });
      el.recenterButton.addEventListener("click", function () {
        fitMapToCafes(getFilteredCafes());
      });
      el.zoomInButton.addEventListener("click", function () {
        if (map) {
          map.setZoom((map.getZoom() || 14) + 1);
        }
      });
      el.zoomOutButton.addEventListener("click", function () {
        if (map) {
          map.setZoom((map.getZoom() || 14) - 1);
        }
      });
    }

    function getApiKey() {
      if (typeof window.CONCAFE_GOOGLE_MAPS_API_KEY === "string") {
        const runtimeKey = window.CONCAFE_GOOGLE_MAPS_API_KEY.trim();
        if (runtimeKey) return runtimeKey;
      }
      return "AIzaSyAzV1-gLzp8dezuUKfTHvSFTw7g9eG8IBc";
    }

    function setMapOverlay(stateName) {
      if (stateName === "ready") {
        el.mapEmpty.classList.remove("is-visible", "is-error");
        return;
      }

      el.mapEmpty.classList.add("is-visible");
      el.mapEmpty.classList.toggle("is-error", stateName === "error");

      if (stateName === "error") {
        el.mapEmptyTitle.textContent = "지도를 불러오지 못했습니다";
        el.mapEmptyMessage.textContent = "네트워크 상태를 확인한 뒤 다시 시도해주세요.";
        return;
      }

      el.mapEmptyTitle.textContent = "지도를 불러오는 중입니다";
      el.mapEmptyMessage.textContent = "잠시만 기다려주세요. 주변 카페 위치를 준비하고 있습니다.";
    }

    async function loadCafes() {
      el.mapHeaderCaption.textContent = "실제 카페 데이터를 불러오는 중입니다.";
      const snapshot = await db.collection("cafes").get();
      state.cafes = snapshot.docs
        .map(buildCafeModel)
        .filter(Boolean)
        .sort(function (a, b) {
          return a.name.localeCompare(b.name, "ko");
        });
      state.activeCafeId = state.cafes[0] ? state.cafes[0].id : "";
      await applyNearestDistrictFromUserLocation();
      syncRegionFilter();
    }

    function loadGoogleMaps(apiKey) {
      return new Promise(function (resolve, reject) {
        if (window.google && window.google.maps) {
          resolve();
          return;
        }

        const callbackName = "__concafeInitGoogleMap";
        window[callbackName] = function () {
          resolve();
          delete window[callbackName];
        };

        const script = document.createElement("script");
        script.src =
          "https://maps.googleapis.com/maps/api/js?key=" +
          encodeURIComponent(apiKey) +
          "&language=ko&region=KR&callback=" +
          callbackName;
        script.async = true;
        script.defer = true;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    function initMap() {
      const initialCenter = state.userLocation || { lat: 37.5665, lng: 126.9780 };
      map = new window.google.maps.Map(document.getElementById("map"), {
        center: initialCenter,
        zoom: state.userLocation ? 13 : 11,
        disableDefaultUI: true,
        clickableIcons: false,
        mapTypeId: state.mapTypeId,
      });

      infoWindow = new window.google.maps.InfoWindow();

      state.cafes.forEach(function (cafe) {
        const marker = new window.google.maps.Marker({
          map: map,
          position: { lat: cafe.lat, lng: cafe.lng },
          title: cafe.name,
          icon: createMarkerIcon(false),
        });

        marker.addListener("click", function () {
          selectCafe(cafe.id, false);
          openInfoWindow(cafe);
        });

        markers.set(cafe.id, marker);
      });

      setMapOverlay("ready");
      syncRegionFilter();
      syncMapTypeFilter();
      syncUI();
      fitMapToCafes(getFilteredCafes());
    }

    function openDetailPanel(cafe) {
      if (!cafe) {
        return;
      }

      currentDetailCafeId = cafe.id;
      el.detailTag.textContent = cafe.theme || "메이드 카페";
      el.detailName.textContent = cafe.name;
      el.detailAddress.textContent = cafe.district + " · " + cafe.address;
      el.detailNote.textContent = cafe.note || "카페 상세 정보는 앱에서 확인할 수 있습니다.";

      if (cafe.image) {
        el.detailImage.src = cafe.image;
        el.detailImage.style.display = "block";
        el.detailImagePlaceholder.style.display = "none";
      } else {
        el.detailImage.src = "";
        el.detailImage.style.display = "none";
        el.detailImagePlaceholder.style.display = "";
      }

      el.mapDetailPanel.classList.add("is-open");
      el.detailReviews.style.display = "";
      loadCafeReviews(cafe.id);
      updateReviewFormState();
    }

    function closeDetailPanel() {
      el.mapDetailPanel.classList.remove("is-open");
      currentDetailCafeId = "";
      if (el.reviewStatus) {
        el.reviewStatus.style.display = "none";
        el.reviewStatus.textContent = "";
        el.reviewStatus.className = "review-status";
      }
    }

    function updateAuthWidget(user) {
      currentUser = user;
      if (user) {
        el.authUserPhoto.src = user.photoURL || "";
        el.authUserPhoto.style.display = user.photoURL ? "" : "none";
        el.authUserName.textContent = user.displayName || user.email || "사용자";
        el.authUserInfo.style.display = "flex";
        el.signInBtn.style.display = "none";
      } else {
        el.authUserInfo.style.display = "none";
        el.signInBtn.style.display = "";
      }
      updateReviewFormState();
    }

    function updateReviewFormState() {
      if (!currentDetailCafeId) {
        return;
      }
      if (currentUser) {
        el.reviewFormSection.style.display = "";
        el.reviewLoginPrompt.style.display = "none";
      } else {
        el.reviewFormSection.style.display = "none";
        el.reviewLoginPrompt.style.display = "";
      }
    }

    function loadCafeReviews(cafeId) {
      el.reviewsList.innerHTML = '<p class="reviews-empty">리뷰를 불러오는 중...</p>';
      el.reviewsTitle.textContent = "리뷰";
      db.collection("reviews")
        .where("cafeId", "==", cafeId)
        .limit(20)
        .get()
        .then(function (snapshot) {
          if (currentDetailCafeId !== cafeId) {
            return;
          }
          var sorted = snapshot.docs.slice().sort(function (a, b) {
            var aAt = (a.data() || {}).createdAt || "";
            var bAt = (b.data() || {}).createdAt || "";
            return bAt < aAt ? -1 : bAt > aAt ? 1 : 0;
          });
          renderReviews(sorted);
        })
        .catch(function (error) {
          if (currentDetailCafeId !== cafeId) {
            return;
          }
          el.reviewsList.innerHTML = '<p class="reviews-empty">리뷰를 불러오지 못했습니다.</p>';
          console.error(error);
        });
    }

    function renderReviews(docs) {
      el.reviewsTitle.textContent = "리뷰 " + docs.length + "개";
      if (!docs.length) {
        el.reviewsList.innerHTML = '<p class="reviews-empty">아직 리뷰가 없습니다. 첫 리뷰를 작성해보세요!</p>';
        return;
      }
      el.reviewsList.innerHTML = docs.map(function (doc) {
        var data = doc.data() || {};
        var rating = Math.max(0, Math.min(5, data.rating || 0));
        var stars = "★".repeat(rating) + "☆".repeat(5 - rating);
        var photo = data.userPhotoUrl
          ? '<img class="review-user-photo" src="' + escapeHtml(data.userPhotoUrl) + '" alt="" />'
          : '<div class="review-user-photo"></div>';
        var firstImageUrl = Array.isArray(data.imageUrls) && data.imageUrls.length > 0 ? data.imageUrls[0] : "";
        var img = firstImageUrl
          ? '<img class="review-img" src="' + escapeHtml(firstImageUrl) + '" alt="리뷰 이미지" loading="lazy" />'
          : "";
        var dateStr = typeof data.createdAt === "string" ? data.createdAt.slice(0, 10) : "";
        return (
          '<div class="review-card">' +
          '<div class="review-card-head">' + photo +
          '<span class="review-user-name">' + escapeHtml(data.userNickname || "익명") + "</span>" +
          '<span class="review-stars">' + stars + "</span>" +
          '<span class="review-date">' + escapeHtml(dateStr) + "</span>" +
          "</div>" +
          (data.content ? '<p class="review-content">' + escapeHtml(data.content) + "</p>" : "") +
          img +
          "</div>"
        );
      }).join("");
    }

    function updateStarDisplay() {
      el.starBtns.forEach(function (btn, index) {
        btn.classList.toggle("active", index < reviewRating);
      });
    }

    function showReviewStatus(type, message) {
      if (!message) {
        el.reviewStatus.style.display = "none";
        return;
      }
      el.reviewStatus.textContent = message;
      el.reviewStatus.className = "review-status" + (type ? " " + type : "");
      el.reviewStatus.style.display = "";
    }

    async function handleReviewSubmit() {
      if (!currentUser || !currentDetailCafeId) {
        return;
      }
      if (reviewRating === 0) {
        showReviewStatus("error", "별점을 선택해주세요.");
        return;
      }
      var cafeId = currentDetailCafeId;
      var content = el.reviewContentInput.value.trim();
      el.submitReviewBtn.disabled = true;
      showReviewStatus("", "리뷰를 등록하는 중...");

      try {
        var imageUrl = "";
        if (reviewImageFile) {
          try {
            var ext = reviewImageFile.name.split(".").pop() || "jpg";
            var path = "reviews/" + cafeId + "/" + currentUser.uid + "_" + Date.now() + "." + ext;
            var ref = storage.ref(path);
            await ref.put(reviewImageFile);
            imageUrl = await ref.getDownloadURL();
          } catch (uploadError) {
            console.warn("Image upload failed, submitting without image", uploadError);
          }
        }

        await db.collection("reviews").add({
          cafeId: cafeId,
          userId: currentUser.uid,
          userNickname: currentUser.displayName || "익명",
          userPhotoUrl: currentUser.photoURL || "",
          visitId: "",
          rating: reviewRating,
          content: content,
          imageUrls: imageUrl ? [imageUrl] : [],
          visitVerified: false,
          likeCount: 0,
          taggedCastIds: [],
          createdAt: new Date().toISOString(),
        });

        el.reviewContentInput.value = "";
        reviewRating = 0;
        reviewImageFile = null;
        el.reviewImageFile.value = "";
        el.reviewImagePreview.innerHTML = "";
        updateStarDisplay();
        showReviewStatus("success", "리뷰가 등록되었습니다!");
        if (currentDetailCafeId === cafeId) {
          loadCafeReviews(cafeId);
        }
      } catch (error) {
        showReviewStatus("error", "리뷰 등록에 실패했습니다.");
        console.error(error);
      } finally {
        el.submitReviewBtn.disabled = false;
      }
    }

    function init() {
      loadSavedMapType();
      bindUI();
      setMapOverlay("loading");
      loadCafes()
        .then(function () {
          syncRegionFilter();
          syncMapTypeFilter();
          syncUI();

          const apiKey = getApiKey();
          if (!apiKey) {
            setMapOverlay("error");
            return;
          }

          loadGoogleMaps(apiKey)
            .then(initMap)
            .catch(function (error) {
              console.error(error);
              setMapOverlay("error");
            });
        })
        .catch(function (error) {
          console.error(error);
          setMapOverlay("error");
          el.mapHeaderCaption.textContent = "카페 데이터를 불러오지 못했습니다.";
          el.mapCafeCount.textContent = "0곳";
          el.resultsTitle.textContent = "검색 결과 0곳";
          el.resultsSubtitle.textContent = "Firestore 카페 데이터를 불러오지 못했습니다.";
          syncRegionFilter();
          syncMapTypeFilter();
          syncUI();
        });
    }

    init();
  })();
</script>
</body>
</html>
