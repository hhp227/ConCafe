<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>캐스트 스케줄 · 콘카</title>
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <script>
      // 캐스트 스케줄 조회는 카페 상세(/cafe)의 '스케줄' 탭으로 옮겼다. 예전 주소로 들어오면 그쪽으로 보낸다
      (function () {
        var cafeId = new URLSearchParams(window.location.search).get("cafeId");
        window.location.replace(cafeId ? "/cafe?id=" + encodeURIComponent(cafeId) + "#schedule" : "/cafes");
      })();
    </script>
  </head>
  <body>
    <p>캐스트 스케줄은 <a href="/cafes">카페 목록</a>에서 카페를 선택해 확인할 수 있습니다.</p>
  </body>
</html>
