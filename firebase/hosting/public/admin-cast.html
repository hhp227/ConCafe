<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>캐스트 상세 · 콘카 관리자</title>
    <meta name="description" content="캐스트 정보를 보고 바로 수정하는 관리자 페이지입니다." />
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/">
            <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />
            <span class="brand-title" aria-label="콘셉카페">
              <span class="brand-main">콘</span><span class="brand-sub">셉</span><span class="brand-main">카</span><span class="brand-sub">페</span>
            </span>
          </a>
          <div class="topbar-right">
            <nav class="nav-links app-nav" aria-label="관리자 페이지 메뉴">
              <a class="nav-link" href="/registration" data-nav-roles="ADMIN,CAFE_OWNER" style="display: none;">캐스트 스케줄 등록</a>
              <a class="nav-link" href="/schedule">캐스트 스케줄 조회</a>
              <a class="nav-link" href="/cafes">카페 목록</a>
              <a class="nav-link" href="/map">메이드 카페 지도</a>
              <a class="nav-link" id="adminNavLink" href="/admin" style="display: none;">관리자</a>
            </nav>
            <div class="auth-widget" id="authWidget">
              <div class="auth-user-info" id="authUserInfo" style="display:none;">
                <img class="auth-user-photo" id="authUserPhoto" src="" alt="프로필" />
                <span class="auth-user-name" id="authUserName"></span>
                <button class="auth-btn signout" id="signOutBtn" type="button">로그아웃</button>
              </div>
              <button class="auth-btn" id="signInBtn" type="button">로그인</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container">
        <div class="page">
          <nav class="breadcrumb" aria-label="위치">
            <a href="/admin">카페 관리</a><span class="breadcrumb-sep">›</span><a id="breadcrumbCafeLink" href="/admin">카페</a><span class="breadcrumb-sep">›</span><span id="breadcrumbCastName">캐스트 상세</span>
          </nav>

          <section class="hero">
            <div class="surface hero-copy" id="castSurface">
              <div id="castView">
                <div class="detail-toolbar">
                  <button class="button button-secondary" id="castEditButton" type="button" disabled>캐스트 정보 수정</button>
                </div>
                <div class="cast-detail-head">
                  <div class="cast-detail-photo" id="castPhoto"></div>
                  <div>
                    <div class="chip-row" id="castChips"></div>
                    <h1 id="castTitle">캐스트 상세</h1>
                    <dl class="cafe-info-list" id="castInfo"></dl>
                  </div>
                </div>
              </div>

              <form class="edit-form" id="castEditForm" novalidate hidden>
                <div class="section-header" style="margin-bottom: 0;">
                  <div>
                    <h2>캐스트 정보 수정</h2>
                    <p>수정 완료를 누르면 앱에 바로 반영됩니다.</p>
                  </div>
                </div>
                <div class="field-grid">
                  <div class="field wide">
                    <label>프로필 사진</label>
                    <div id="editCastPhotoEditor"></div>
                  </div>
                  <div class="field">
                    <label for="editCastName">이름</label>
                    <input id="editCastName" type="text" maxlength="30" required />
                  </div>
                  <div class="field">
                    <label for="editCastConceptRole">역할</label>
                    <select id="editCastConceptRole"></select>
                  </div>
                  <div class="field">
                    <label for="editCastBirthday">생일</label>
                    <input id="editCastBirthday" type="date" />
                  </div>
                  <div class="field wide">
                    <label for="editCastDesc">소개</label>
                    <textarea id="editCastDesc" maxlength="500" style="min-height: 100px;"></textarea>
                  </div>
                  <div class="field wide">
                    <label>갤러리 (최대 3장)</label>
                    <div id="editCastGalleryEditor"></div>
                  </div>
                </div>
                <div class="edit-form-actions">
                  <button class="button button-primary" id="castEditSubmitButton" type="submit">수정 완료</button>
                  <button class="button button-ghost" id="castEditCancelButton" type="button">취소</button>
                </div>
              </form>

            </div>

            <aside class="surface hero-meta">
              <div class="stat-list">
                <div class="stat">
                  <span class="stat-label">팔로워</span>
                  <strong class="stat-value" id="castFollowerCount">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">평점</span>
                  <strong class="stat-value" id="castRating">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">방문 인증</span>
                  <strong class="stat-value" id="castVisitCount">0</strong>
                </div>
                <div class="stat">
                  <span class="stat-label">캐스트 ID</span>
                  <strong class="stat-value mono small" id="castIdLabel">-</strong>
                </div>
              </div>
              <div class="aside-actions">
                <button class="button button-secondary" id="castRestoreButton" type="button" hidden>현재 없음 → 복원</button>
                <a class="button button-ghost" id="castBackLink" href="/admin">캐스트 목록으로</a>
                <button class="button button-danger" id="castDeleteButton" type="button" disabled>캐스트 삭제</button>
              </div>
            </aside>
          </section>

          <section class="surface section" id="castGallerySection" style="margin-top: 20px;" hidden>
            <div class="section-header">
              <div>
                <h2>갤러리</h2>
                <p>앱의 캐스트 상세 화면에 보이는 사진입니다.</p>
              </div>
            </div>
            <div class="cast-gallery" id="castGallery"></div>
          </section>
        </div>
        <footer class="footer">
          <span>© 2026 콘카(ConCafe)</span>
          <span><a href="/privacy">개인정보처리방침</a></span>
        </footer>
      </main>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-common.js"></script>
    <script>
      (function () {
        const A = window.ConcafeAdmin;
        const db = A.db;
        const escapeHtml = A.escapeHtml;
        const setBanner = A.setBanner;

        const INACTIVE_REASON_LABELS = { NOT_IN_SCHEDULE_IMAGE: "출근표에 없음" };
        const CREATED_VIA_LABELS = { ADMIN_WEB: "관리자 웹", SCHEDULE_IMAGE_IMPORT: "출근표 이미지 등록" };

        const params = new URLSearchParams(window.location.search);
        const cafeId = (params.get("cafeId") || "").trim();
        const castId = (params.get("castId") || "").trim();

        const state = {
          user: null,
          cafe: null,
          cast: null,
          otherCastNames: [],
          editing: false,
          saving: false,
          busy: false,
        };

        const el = {};
        [
          "breadcrumbCafeLink", "breadcrumbCastName", "castSurface", "castView", "castEditButton", "castPhoto", "castChips",
          "castTitle", "castInfo", "castEditForm", "editCastPhotoEditor", "editCastName", "editCastConceptRole",
          "editCastBirthday", "editCastDesc", "editCastGalleryEditor", "castEditSubmitButton",
          "castEditCancelButton", "castFollowerCount", "castRating", "castVisitCount", "castIdLabel",
          "castRestoreButton", "castBackLink", "castDeleteButton", "castGallerySection", "castGallery",
        ].forEach(function (id) {
          el[id] = document.getElementById(id);
        });

        function isReady() {
          return !!state.user && !!state.cafe && !!state.cast;
        }

        function updateAvailability() {
          const ready = isReady();
          const locked = state.saving || state.busy;
          el.castEditButton.disabled = !ready || state.editing || locked;
          el.castEditSubmitButton.disabled = !ready || locked;
          el.castEditCancelButton.disabled = state.saving;
          el.castDeleteButton.disabled = !ready || state.editing || locked;
          el.castRestoreButton.disabled = !ready || state.editing || locked;
        }

        function formatDate(iso) {
          return /^\d{4}-\d{2}-\d{2}/.test(iso || "") ? iso.slice(0, 10) : "";
        }

        function formatBirthday(value) {
          const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(value || "");
          return match ? Number(match[2]) + "월 " + Number(match[3]) + "일" : value;
        }

        // ---------- 보기 ----------

        function renderCast() {
          const cast = state.cast;
          el.castIdLabel.textContent = castId || "-";
          if (!cast) {
            el.castPhoto.innerHTML = "";
            el.castChips.innerHTML = "";
            el.castInfo.innerHTML = "";
            el.castGallerySection.hidden = true;
            el.castRestoreButton.hidden = true;
            return;
          }
          document.title = cast.name + " · " + (state.cafe ? state.cafe.name + " · " : "") + "콘카 관리자";
          el.breadcrumbCastName.textContent = cast.name;
          el.castTitle.textContent = cast.name;
          el.castPhoto.innerHTML = cast.profileImage
            ? '<img src="' + escapeHtml(cast.profileImage) + '" alt="" />'
            : escapeHtml(cast.name.slice(0, 1));
          const chips = [];
          if (cast.conceptRole) {
            chips.push('<span class="chip">' + escapeHtml(A.castRoleLabel(cast.conceptRole)) + "</span>");
          }
          chips.push(cast.inactive
            ? '<span class="chip warning">현재 없음' + (INACTIVE_REASON_LABELS[cast.inactiveReason] ? " · " + escapeHtml(INACTIVE_REASON_LABELS[cast.inactiveReason]) : "") + "</span>"
            : '<span class="chip success">활동 중</span>');
          if (cast.linkedUserId) {
            chips.push('<span class="chip">계정 연결됨</span>');
          }
          el.castChips.innerHTML = chips.join("");
          const rows = [
            ["생일", formatBirthday(cast.birthday)],
            ["소개", A.castDescText(cast) || "소개 없음"],
            ["현재 없음 처리일", cast.inactive ? formatDate(cast.inactiveAt) : ""],
            ["등록 경로", CREATED_VIA_LABELS[cast.createdVia] || cast.createdVia],
            ["등록일", formatDate(cast.createdAt)],
            ["최근 수정일", formatDate(cast.updatedAt)],
          ].filter(function (row) { return row[1]; });
          el.castInfo.innerHTML = rows.map(function (row) {
            return "<dt>" + escapeHtml(row[0]) + "</dt><dd>" + escapeHtml(row[1]) + "</dd>";
          }).join("");
          el.castFollowerCount.textContent = String(cast.followerCount);
          el.castRating.textContent = cast.rating ? cast.rating.toFixed(1) : "0";
          el.castVisitCount.textContent = String(cast.visitCertificationCount);
          el.castRestoreButton.hidden = !cast.inactive;
          el.castGallerySection.hidden = !cast.galleryImages.length;
          el.castGallery.innerHTML = cast.galleryImages.map(function (url) {
            return '<img src="' + escapeHtml(url) + '" alt="" loading="lazy" />';
          }).join("");
        }

        async function loadCast() {
          const doc = await db.collection("cafes").doc(cafeId).collection("casts").doc(castId).get();
          state.cast = doc.exists ? A.toCast(doc) : null;
          return !!state.cast;
        }

        // ---------- 수정 (같은 화면에서 입력폼으로 전환) ----------

        const photoEditor = A.createImageEditor({
          container: el.editCastPhotoEditor,
          max: 1,
          shape: "portrait",
          addLabel: "프로필 사진",
          onError: function (message) { setBanner("castEditStatus", "error", message); },
        });
        const galleryEditor = A.createImageEditor({
          container: el.editCastGalleryEditor,
          max: 3,
          shape: "portrait",
          addLabel: "사진 추가",
          onError: function (message) { setBanner("castEditStatus", "error", message); },
        });

        function setEditing(editing) {
          state.editing = editing;
          el.castView.hidden = editing;
          el.castEditForm.hidden = !editing;
          el.castSurface.classList.toggle("is-editing", editing);
          updateAvailability();
        }

        function startEdit() {
          const cast = state.cast;
          if (!cast || state.editing) {
            return;
          }
          el.editCastName.value = cast.name;
          const knownRole = A.CAST_CONCEPT_ROLES.some(function (role) { return role[0] === cast.conceptRole; });
          if (cast.conceptRole && !knownRole) {
            el.editCastConceptRole.insertAdjacentHTML("beforeend", '<option value="' + escapeHtml(cast.conceptRole) + '">' + escapeHtml(cast.conceptRole) + "</option>");
          }
          el.editCastConceptRole.value = cast.conceptRole || "maid";
          el.editCastBirthday.value = /^\d{4}-\d{2}-\d{2}$/.test(cast.birthday) ? cast.birthday : "";
          el.editCastDesc.value = A.castDescText(cast);
          photoEditor.setUrls(cast.profileImage ? [cast.profileImage] : []);
          galleryEditor.setUrls(cast.galleryImages);
          A.hideBanner("castEditStatus");
          setEditing(true);
          el.castSurface.scrollIntoView({ behavior: "smooth", block: "start" });
          el.editCastName.focus({ preventScroll: true });
        }

        function cancelEdit() {
          if (!state.saving) {
            setEditing(false);
          }
        }

        async function handleEditSubmit(event) {
          event.preventDefault();
          const cast = state.cast;
          if (!isReady() || state.saving) {
            return;
          }
          const name = el.editCastName.value.trim();
          if (!name) {
            setBanner("castEditStatus", "error", "이름을 입력하세요.");
            return;
          }
          if (A.normalizeName(name) !== A.normalizeName(cast.name)) {
            const sameName = state.otherCastNames.find(function (other) { return A.normalizeName(other) === A.normalizeName(name); });
            if (sameName && !window.confirm("같은 이름의 캐스트(" + sameName + ")가 이미 있습니다. 그래도 저장할까요?")) {
              return;
            }
          }

          state.saving = true;
          photoEditor.setDisabled(true);
          galleryEditor.setDisabled(true);
          updateAvailability();
          try {
            setBanner("castEditStatus", "loading", "사진을 올리는 중입니다.");
            const photoUrls = await photoEditor.upload("casts/profile", cafeId);
            const galleryUrls = await galleryEditor.upload("casts/gallery", cafeId);
            const birthday = el.editCastBirthday.value || null;
            setBanner("castEditStatus", "loading", "캐스트 정보를 저장하는 중입니다.");
            // 앱(CastEdit)이 저장하는 필드만 바꾸고 팔로워·평점·계정 연결 등은 그대로 둔다
            await db.collection("cafes").doc(cafeId).collection("casts").doc(castId).update({
              name: name,
              conceptRole: el.editCastConceptRole.value,
              birthday: birthday,
              birthdayKey: birthday ? birthday.slice(5) : null,
              desc: el.editCastDesc.value.trim(),
              profileImage: photoUrls[0] || null,
              galleryImages: galleryUrls,
              updatedAt: A.nowIso(),
            });
            // 이번 수정으로 빠진 사진은 앱과 같이 Storage에서도 지운다
            const before = [cast.profileImage].concat(cast.galleryImages);
            const after = photoUrls.concat(galleryUrls);
            A.deleteStorageImages(before.filter(function (url) { return url && after.indexOf(url) < 0; }));

            await loadCast();
            renderCast();
            state.saving = false;
            setEditing(false);
            setBanner("castStatus", "success", "캐스트 정보를 수정했습니다.");
          } catch (error) {
            setBanner("castEditStatus", "error", "캐스트 정보를 저장하지 못했습니다. 잠시 후 다시 시도하세요.");
            console.error(error);
          } finally {
            state.saving = false;
            photoEditor.setDisabled(false);
            galleryEditor.setDisabled(false);
            updateAvailability();
          }
        }

        // ---------- 복원 / 삭제 ----------

        async function restoreCast() {
          if (!isReady() || !state.cast.inactive) {
            return;
          }
          state.busy = true;
          updateAvailability();
          try {
            const now = A.nowIso();
            await db.collection("cafes").doc(cafeId).collection("casts").doc(castId).update({
              rosterStatus: "ACTIVE",
              reactivatedAt: now,
              updatedAt: now,
            });
            await loadCast();
            renderCast();
            setBanner("castStatus", "success", state.cast.name + " 캐스트를 복원했습니다.");
          } catch (error) {
            setBanner("castStatus", "error", "캐스트를 복원하지 못했습니다.");
            console.error(error);
          } finally {
            state.busy = false;
            updateAvailability();
          }
        }

        // 캐스트 문서를 지우면 서버 트리거가 프로필·갤러리 이미지와 castDirectory 항목을 정리한다
        async function deleteCast() {
          const cast = state.cast;
          if (!isReady()) {
            return;
          }
          const message = "'" + cast.name + "' 캐스트를 삭제합니다." +
            (cast.linkedUserId ? "\n이 캐스트는 사용자 계정과 연결되어 있습니다. 삭제하면 연결도 끊어집니다." : "") +
            "\n프로필과 갤러리 이미지도 함께 지워지며 되돌릴 수 없습니다. 계속할까요?";
          if (!window.confirm(message)) {
            return;
          }
          state.busy = true;
          updateAvailability();
          try {
            await db.collection("cafes").doc(cafeId).collection("casts").doc(castId).delete();
            window.ConcafeToast.flash("success", cast.name + " 캐스트를 삭제했습니다.");
            window.location.href = A.cafeDetailUrl(cafeId, "casts");
          } catch (error) {
            setBanner("castStatus", "error", "캐스트를 삭제하지 못했습니다. 관리자 권한을 확인하세요.");
            console.error(error);
            state.busy = false;
            updateAvailability();
          }
        }

        // ---------- 세션 ----------

        async function handleSession(session) {
          if (!session.isAdmin) {
            setEditing(false);
            state.user = null;
            state.cafe = null;
            state.cast = null;
            renderCast();
            updateAvailability();
            return;
          }
          state.user = session.user;
          if (!cafeId || !castId) {
            setBanner("castStatus", "error", "카페 또는 캐스트 ID가 없습니다. 캐스트 목록에서 다시 선택하세요.");
            return;
          }
          try {
            state.cafe = await A.fetchCafe(cafeId);
            if (!state.cafe) {
              setBanner("castStatus", "error", "카페를 찾을 수 없습니다.");
              return;
            }
            el.breadcrumbCafeLink.textContent = state.cafe.name;
            el.breadcrumbCafeLink.href = A.cafeDetailUrl(cafeId, "casts");
            el.castBackLink.href = A.cafeDetailUrl(cafeId, "casts");
            if (!(await loadCast())) {
              setBanner("castStatus", "error", "캐스트를 찾을 수 없습니다. 삭제되었거나 잘못된 주소입니다.");
              renderCast();
              return;
            }
            A.hideBanner("castStatus");
            renderCast();
            // 이름 중복 확인용 (실패해도 수정에는 지장 없음)
            A.fetchCasts(cafeId).then(function (casts) {
              state.otherCastNames = casts.filter(function (item) { return item.id !== castId; }).map(function (item) { return item.name; });
            }).catch(function () {});
          } catch (error) {
            setBanner("castStatus", "error", "캐스트 정보를 불러오지 못했습니다.");
            console.error(error);
          }
          updateAvailability();
        }

        // ---------- 이벤트 연결 ----------

        el.castIdLabel.textContent = castId || "-";
        if (cafeId) {
          el.breadcrumbCafeLink.href = A.cafeDetailUrl(cafeId, "casts");
          el.castBackLink.href = A.cafeDetailUrl(cafeId, "casts");
        }
        el.editCastConceptRole.innerHTML = A.CAST_CONCEPT_ROLES.map(function (role) {
          return '<option value="' + role[0] + '">' + escapeHtml(role[1]) + "</option>";
        }).join("");
        el.castEditButton.addEventListener("click", startEdit);
        el.castEditCancelButton.addEventListener("click", cancelEdit);
        el.castEditForm.addEventListener("submit", handleEditSubmit);
        el.castRestoreButton.addEventListener("click", restoreCast);
        el.castDeleteButton.addEventListener("click", deleteCast);
        window.addEventListener("beforeunload", function (e) {
          if (state.editing) {
            e.preventDefault();
            e.returnValue = "";
          }
        });

        updateAvailability();
        A.initAdminSession(handleSession);
      })();
    </script>
    <script src="/assets/js/admin-nav.js"></script>
  </body>
</html>
