<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>캐스트 스케줄 등록 · 콘카</title>
    <meta name="description" content="카페 운영자가 캐스트의 근무·휴무·휴가 스케줄을 등록하는 페이지입니다." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/images/concafe_logo.png" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="/cafes">
            <img class="brand-icon" src="/assets/images/concafe_logo.png" alt="콘카 로고" />
            <span class="brand-title" aria-label="콘셉카페">
              <span class="brand-main">콘</span><span class="brand-sub">셉</span><span class="brand-main">카</span><span class="brand-sub">페</span>
            </span>
          </a>
          <div class="topbar-right">
            <nav class="nav-links app-nav" aria-label="주요 메뉴">
              <a class="nav-link" href="/cafes">카페 목록</a>
              <a class="nav-link" href="/map">메이드 카페 지도</a>
            </nav>
            <div class="auth-widget" id="authWidget">
              <div class="auth-user-info" id="authUserInfo" style="display:none;">
                <img class="auth-user-photo" id="authUserPhoto" src="" alt="프로필" />
                <span class="auth-user-name" id="authUserName"></span>
                <button class="auth-btn signout" id="signOutBtn" type="button">로그아웃</button>
              </div>
              <button class="auth-btn" id="signInBtn" type="button">로그인</button>
            </div>
          </div>
        </div>
      </header>

      <main class="container">
        <div class="page">
          <nav class="breadcrumb" aria-label="위치">
            <a href="/cafes">카페 목록</a><span class="breadcrumb-sep">›</span><a id="breadcrumbCafeLink" href="/cafes">카페</a><span class="breadcrumb-sep">›</span><span>캐스트 스케줄 등록</span>
          </nav>

          <section class="surface section">
            <div class="cafe-mini" style="margin: 0;">
              <div class="cafe-mini-thumb" id="cafeThumb"></div>
              <div>
                <h1 id="cafeTitle">캐스트 스케줄 등록</h1>
                <p id="cafeSub">카페 운영자만 캐스트 스케줄을 등록할 수 있습니다.</p>
              </div>
            </div>
          </section>

          <div class="reg-layout">
            <section class="surface section reg-form-section">
              <div class="section-header">
                <div>
                  <h2>스케줄 입력</h2>
                  <p>오른쪽 표의 칸을 누르면 그 캐스트와 날짜가 채워집니다.</p>
                </div>
              </div>
              <form class="reg-form" id="scheduleForm" novalidate>
                <div class="field">
                  <label for="scheduleCast">캐스트</label>
                  <select id="scheduleCast" required>
                    <option value="">캐스트를 선택하세요</option>
                  </select>
                </div>
                <div class="field">
                  <label for="scheduleDate">날짜</label>
                  <input id="scheduleDate" type="date" required />
                </div>
                <div class="field">
                  <label>상태</label>
                  <div class="segmented" id="scheduleStatus" role="radiogroup" aria-label="상태">
                    <button class="is-active" type="button" role="radio" aria-checked="true" data-status="WORK">근무</button>
                    <button type="button" role="radio" aria-checked="false" data-status="OFF">휴무</button>
                    <button type="button" role="radio" aria-checked="false" data-status="VACATION">휴가</button>
                  </div>
                </div>
                <div class="field" id="timeField">
                  <label for="scheduleStartTime">근무 시간</label>
                  <div class="reg-time-row">
                    <input id="scheduleStartTime" type="time" aria-label="시작 시간" />
                    <span aria-hidden="true">~</span>
                    <input id="scheduleEndTime" type="time" aria-label="종료 시간" />
                  </div>
                </div>
                <div class="field">
                  <label for="scheduleMemo">메모</label>
                  <input id="scheduleMemo" type="text" maxlength="100" placeholder="선택 입력" />
                </div>
                <p class="reg-form-note" id="scheduleFormNote" hidden></p>
                <div class="edit-form-actions">
                  <button class="button button-primary" id="scheduleSubmitButton" type="submit" disabled>스케줄 저장</button>
                  <button class="button button-ghost" id="scheduleResetButton" type="button">초기화</button>
                </div>
              </form>
            </section>

            <section class="surface section reg-board-section">
              <div class="section-header">
                <div>
                  <h2>주간 등록 현황</h2>
                  <p>캐스트별로 등록된 근무·휴무·휴가를 한 주씩 확인합니다.</p>
                </div>
              </div>
              <div class="sched-toolbar">
                <div class="sched-nav">
                  <button class="button button-ghost sched-nav-button" type="button" data-week-move="-1" aria-label="이전 주">‹</button>
                  <strong class="sched-period" id="weekLabel" aria-live="polite"></strong>
                  <button class="button button-ghost sched-nav-button" type="button" data-week-move="1" aria-label="다음 주">›</button>
                  <button class="button button-ghost sched-today" type="button" id="weekTodayButton">이번 주</button>
                </div>
                <div class="reg-legend">
                  <span class="reg-status work">근무</span>
                  <span class="reg-status off">휴무</span>
                  <span class="reg-status vacation">휴가</span>
                </div>
              </div>
              <div class="reg-board-scroll">
                <table class="reg-board" id="weekBoard"></table>
              </div>
              <p class="empty" id="boardEmptyState">캐스트를 불러오는 중입니다.</p>
              <div class="reg-board-foot">
                <span class="helper" id="boardFootNote"></span>
                <a class="button button-secondary" id="castNewLink" href="/cast-new" hidden>+ 캐스트 등록</a>
              </div>
            </section>
          </div>
        </div>
        <footer class="footer">
          <span>© 2026 콘카(ConCafe)</span>
          <div class="footer-links">
            <a href="/privacy">개인정보처리방침</a>
            <div class="footer-store">
              <a href="https://play.google.com/store/apps/details?id=com.hhp227.concafe" target="_blank" rel="noreferrer">
                <img src="/assets/images/googleplay.png" alt="Google Play에서 다운로드" width="130" height="40" />
              </a>
              <a href="https://apps.apple.com/kr/app/%EC%BD%98%EC%B9%B4/id6761295445" target="_blank" rel="noreferrer">
                <img src="/assets/images/appleappstore.png" alt="App Store에서 다운로드" width="130" height="40" />
              </a>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/admin-common.js"></script>
    <script>
      (function () {
        const A = window.ConcafeAdmin;
        const db = A.db;
        const escapeHtml = A.escapeHtml;
        const normalizeText = A.normalizeText;
        const WEEKDAYS = ["월", "화", "수", "목", "금", "토", "일"];
        const STATUS_LABELS = { WORK: "근무", OFF: "휴무", VACATION: "휴가" };
        // 이 페이지에서 만든 스케줄만 여기서 고칠 수 있다. 출근표 분석 등으로 등록된 공식 스케줄은 덮어쓰지 않는다
        const EDITABLE_SOURCE = "TEMP_WEB";
        const cafeId = (new URLSearchParams(window.location.search).get("cafeId") || "").trim();

        const state = {
          user: null,
          cafe: null,
          canManage: false,
          casts: [],
          schedules: [],
          loaded: false,
          status: "WORK",
          weekStart: startOfWeek(new Date()),
          saving: false,
        };

        const el = {};
        [
          "breadcrumbCafeLink", "cafeThumb", "cafeTitle", "cafeSub",
          "scheduleForm", "scheduleCast", "scheduleDate", "scheduleStatus", "timeField", "scheduleStartTime", "scheduleEndTime",
          "scheduleMemo", "scheduleFormNote", "scheduleSubmitButton", "scheduleResetButton",
          "weekLabel", "weekTodayButton", "weekBoard", "boardEmptyState", "boardFootNote", "castNewLink",
        ].forEach(function (id) { el[id] = document.getElementById(id); });

        function pad2(value) {
          return String(value).padStart(2, "0");
        }

        function dateKey(date) {
          return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
        }

        function startOfWeek(date) {
          const start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
          return start;
        }

        function addDays(date, days) {
          const next = new Date(date);
          next.setDate(next.getDate() + days);
          return next;
        }

        function cafeUrl(tab) {
          return "/cafe?id=" + encodeURIComponent(cafeId) + (tab ? "#" + tab : "");
        }

        function findSchedule(castId, date) {
          return state.schedules.find(function (item) {
            return item.castId === castId && item.date === date;
          }) || null;
        }

        // ---------- 카페 / 권한 ----------

        function renderCafe() {
          const cafe = state.cafe;
          if (!cafe) {
            return;
          }
          document.title = "캐스트 스케줄 등록 · " + cafe.name + " · 콘카";
          el.cafeThumb.innerHTML = A.cafeThumbHtml(cafe);
          el.cafeSub.textContent = [cafe.name, cafe.address].filter(Boolean).join(" · ");
          el.breadcrumbCafeLink.textContent = cafe.name;
          el.breadcrumbCafeLink.href = cafeUrl();
          el.castNewLink.href = "/cast-new?cafeId=" + encodeURIComponent(cafeId);
        }

        function updateAvailability() {
          const ready = state.canManage && state.loaded;
          el.scheduleSubmitButton.disabled = !ready || state.saving || !state.casts.length;
          el.castNewLink.hidden = !state.canManage;
          renderFormNote();
        }

        // ---------- 입력 폼 ----------

        function setStatus(status) {
          state.status = status;
          Array.prototype.forEach.call(el.scheduleStatus.querySelectorAll("[data-status]"), function (button) {
            const active = button.getAttribute("data-status") === status;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-checked", active ? "true" : "false");
          });
          el.timeField.hidden = status !== "WORK";
        }

        function renderCastOptions() {
          const current = el.scheduleCast.value;
          el.scheduleCast.innerHTML = '<option value="">캐스트를 선택하세요</option>' + state.casts.map(function (cast) {
            const role = cast.conceptRole ? A.castRoleLabel(cast.conceptRole) : "";
            return '<option value="' + escapeHtml(cast.id) + '">' + escapeHtml(cast.name + (role ? " · " + role : "")) + "</option>";
          }).join("");
          if (state.casts.some(function (cast) { return cast.id === current; })) {
            el.scheduleCast.value = current;
          }
        }

        // 고른 캐스트·날짜에 이미 스케줄이 있으면 폼에 불러오고 안내한다
        function syncFormWithExisting() {
          const existing = el.scheduleCast.value && el.scheduleDate.value
            ? findSchedule(el.scheduleCast.value, el.scheduleDate.value)
            : null;
          if (existing) {
            setStatus(existing.status in STATUS_LABELS ? existing.status : "OFF");
            if (existing.startTime) el.scheduleStartTime.value = existing.startTime;
            if (existing.endTime) el.scheduleEndTime.value = existing.endTime;
            el.scheduleMemo.value = existing.memo;
          }
          renderFormNote();
          renderBoard();
        }

        function renderFormNote() {
          let message = "";
          let locked = false;
          if (!state.canManage) {
            message = "";
          } else if (state.loaded && !state.casts.length) {
            message = "등록된 캐스트가 없습니다. 캐스트를 먼저 등록하세요.";
          } else if (el.scheduleCast.value && el.scheduleDate.value) {
            const existing = findSchedule(el.scheduleCast.value, el.scheduleDate.value);
            if (existing && existing.createdVia !== EDITABLE_SOURCE) {
              message = "출근표 등록 등으로 만든 공식 스케줄이라 여기서는 수정할 수 없습니다.";
              locked = true;
            } else if (existing) {
              message = "이미 등록된 스케줄입니다. 저장하면 내용이 바뀝니다.";
            }
          }
          el.scheduleFormNote.textContent = message;
          el.scheduleFormNote.hidden = !message;
          el.scheduleFormNote.classList.toggle("is-locked", locked);
          if (locked) {
            el.scheduleSubmitButton.disabled = true;
          } else {
            el.scheduleSubmitButton.disabled = !(state.canManage && state.loaded) || state.saving || !state.casts.length;
          }
          el.scheduleSubmitButton.textContent = message.indexOf("이미 등록된") === 0 ? "스케줄 수정" : "스케줄 저장";
        }

        function resetForm() {
          el.scheduleMemo.value = "";
          setStatus("WORK");
          renderFormNote();
          renderBoard();
        }

        async function handleSubmit(event) {
          event.preventDefault();
          if (!state.canManage || state.saving) {
            return;
          }
          const cast = state.casts.find(function (item) { return item.id === el.scheduleCast.value; });
          const date = el.scheduleDate.value;
          const status = state.status;
          const startTime = el.scheduleStartTime.value;
          const endTime = el.scheduleEndTime.value;
          const memo = el.scheduleMemo.value.trim();
          const fail = function (message, field) {
            window.ConcafeToast.show("error", message, { key: "scheduleForm" });
            if (field) field.focus();
          };
          if (!cast) return fail("캐스트를 선택하세요.", el.scheduleCast);
          if (!date) return fail("날짜를 선택하세요.", el.scheduleDate);
          if (status === "WORK" && (!startTime || !endTime)) return fail("근무 시작·종료 시간을 입력하세요.", startTime ? el.scheduleEndTime : el.scheduleStartTime);

          const existing = findSchedule(cast.id, date);
          if (existing && existing.createdVia !== EDITABLE_SOURCE) {
            return fail("출근표 등록 등으로 만든 공식 스케줄은 여기서 수정할 수 없습니다.");
          }

          state.saving = true;
          updateAvailability();
          window.ConcafeToast.show("loading", "스케줄을 저장하는 중입니다.", { key: "scheduleForm" });
          try {
            const now = A.nowIso();
            const docId = existing ? existing.id : cast.id + "_" + date;
            await db.collection("castSchedules").doc(docId).set({
              cafeId: cafeId,
              castId: cast.id,
              castName: cast.name,
              date: date,
              status: status,
              startTime: status === "WORK" ? startTime : null,
              endTime: status === "WORK" ? endTime : null,
              memo: memo || null,
              createdVia: EDITABLE_SOURCE,
              source: EDITABLE_SOURCE,
              createdBy: state.user.uid,
              createdAt: existing && existing.createdAt ? existing.createdAt : now,
              updatedAt: now,
            });
            window.ConcafeToast.show("success",
              cast.name + " · " + date + " " + STATUS_LABELS[status] + " 스케줄을 " + (existing ? "수정" : "저장") + "했습니다.",
              { key: "scheduleForm" });
            await loadSchedules();
            // 같은 캐스트의 다음 날을 이어서 입력할 수 있게 날짜만 하루 넘긴다 (시간은 유지)
            const next = new Date(date + "T00:00:00");
            next.setDate(next.getDate() + 1);
            el.scheduleDate.value = dateKey(next);
            el.scheduleMemo.value = "";
            if (next >= addDays(state.weekStart, 7)) {
              state.weekStart = startOfWeek(next);
            }
            syncFormWithExisting();
          } catch (error) {
            console.error(error);
            window.ConcafeToast.show("error", "스케줄을 저장하지 못했습니다. 잠시 후 다시 시도하세요.", { key: "scheduleForm" });
          } finally {
            state.saving = false;
            updateAvailability();
          }
        }

        // ---------- 주간 등록 현황 ----------

        function renderBoard() {
          const days = WEEKDAYS.map(function (_, index) { return addDays(state.weekStart, index); });
          const end = days[6];
          el.weekLabel.textContent = (state.weekStart.getMonth() + 1) + "/" + state.weekStart.getDate() + " - " +
            (end.getMonth() + 1) + "/" + end.getDate();

          if (!state.casts.length) {
            el.weekBoard.innerHTML = "";
            el.boardEmptyState.hidden = false;
            el.boardEmptyState.textContent = !state.canManage ? "운영 권한을 확인하면 표시됩니다."
              : !state.loaded ? "캐스트를 불러오는 중입니다."
              : "등록된 캐스트가 없습니다. 캐스트를 먼저 등록하세요.";
            el.boardFootNote.textContent = "";
            return;
          }
          el.boardEmptyState.hidden = true;

          const todayKey = dateKey(new Date());
          const selectedCast = el.scheduleCast.value;
          const selectedDate = el.scheduleDate.value;
          let filled = 0;
          const head = "<thead><tr><th scope=\"col\" class=\"reg-board-cast\">캐스트</th>" + days.map(function (date, index) {
            const key = dateKey(date);
            const classes = [key === todayKey ? "is-today" : "", index === 5 ? "is-sat" : index === 6 ? "is-sun" : ""].join(" ").trim();
            return '<th scope="col"' + (classes ? ' class="' + classes + '"' : "") + ">" + WEEKDAYS[index] +
              '<span class="reg-board-date">' + (date.getMonth() + 1) + "/" + date.getDate() + "</span></th>";
          }).join("") + "</tr></thead>";
          const body = "<tbody>" + state.casts.map(function (cast) {
            return "<tr><th scope=\"row\" class=\"reg-board-cast\">" + escapeHtml(cast.name) + "</th>" + days.map(function (date) {
              const key = dateKey(date);
              const item = findSchedule(cast.id, key);
              if (item) filled += 1;
              const selected = cast.id === selectedCast && key === selectedDate;
              const content = item
                ? '<span class="reg-status ' + item.status.toLowerCase() + '">' + escapeHtml(STATUS_LABELS[item.status] || item.status) +
                  (item.status === "WORK" && item.startTime ? "<small>" + escapeHtml(item.startTime + (item.endTime ? "-" + item.endTime : "")) + "</small>" : "") +
                  "</span>"
                : '<span class="reg-empty">+</span>';
              return '<td><button class="reg-cell' + (selected ? " is-selected" : "") + (item && item.createdVia !== EDITABLE_SOURCE ? " is-official" : "") +
                '" type="button" data-cast-id="' + escapeHtml(cast.id) + '" data-date="' + key + '" aria-label="' +
                escapeHtml(cast.name + " " + key + " " + (item ? STATUS_LABELS[item.status] || item.status : "미등록")) + '">' + content + "</button></td>";
            }).join("") + "</tr>";
          }).join("") + "</tbody>";
          el.weekBoard.innerHTML = head + body;
          el.boardFootNote.textContent = "이번 표에 등록된 스케줄 " + filled + "건 · 테두리가 점선인 칸은 출근표 등록으로 만든 공식 스케줄입니다.";
        }

        // ---------- 불러오기 ----------

        async function loadSchedules() {
          const snapshot = await db.collection("castSchedules").where("cafeId", "==", cafeId).get();
          state.schedules = snapshot.docs.map(function (doc) {
            const data = doc.data() || {};
            return {
              id: doc.id,
              castId: normalizeText(data.castId, ""),
              date: normalizeText(data.date, ""),
              status: normalizeText(data.status, "OFF"),
              startTime: normalizeText(data.startTime, ""),
              endTime: normalizeText(data.endTime, ""),
              memo: normalizeText(data.memo, ""),
              createdVia: normalizeText(data.createdVia, ""),
              createdAt: data.createdAt || "",
            };
          });
        }

        async function loadData() {
          try {
            const results = await Promise.all([A.fetchCasts(cafeId), loadSchedules()]);
            state.casts = results[0].filter(function (cast) { return !cast.inactive; });
            state.loaded = true;
          } catch (error) {
            console.error(error);
            window.ConcafeToast.show("error", "캐스트 또는 스케줄을 불러오지 못했습니다.");
          }
          renderCastOptions();
          updateAvailability();
          renderBoard();
        }

        // ---------- 이벤트 연결 ----------

        el.scheduleStatus.addEventListener("click", function (e) {
          const button = e.target.closest("[data-status]");
          if (button) {
            setStatus(button.getAttribute("data-status"));
          }
        });
        el.scheduleCast.addEventListener("change", syncFormWithExisting);
        el.scheduleDate.addEventListener("change", function () {
          if (el.scheduleDate.value) {
            const picked = new Date(el.scheduleDate.value + "T00:00:00");
            if (!Number.isNaN(picked.getTime())) {
              state.weekStart = startOfWeek(picked);
            }
          }
          syncFormWithExisting();
        });
        el.scheduleForm.addEventListener("submit", handleSubmit);
        el.scheduleResetButton.addEventListener("click", resetForm);
        document.querySelectorAll("[data-week-move]").forEach(function (button) {
          button.addEventListener("click", function () {
            state.weekStart = addDays(state.weekStart, Number(button.getAttribute("data-week-move")) * 7);
            renderBoard();
          });
        });
        el.weekTodayButton.addEventListener("click", function () {
          state.weekStart = startOfWeek(new Date());
          renderBoard();
        });
        el.weekBoard.addEventListener("click", function (e) {
          const cell = e.target.closest("[data-cast-id]");
          if (!cell) {
            return;
          }
          el.scheduleCast.value = cell.getAttribute("data-cast-id");
          el.scheduleDate.value = cell.getAttribute("data-date");
          if (!findSchedule(el.scheduleCast.value, el.scheduleDate.value)) {
            el.scheduleMemo.value = "";
            setStatus("WORK");
          }
          syncFormWithExisting();
          if (window.matchMedia("(max-width: 960px)").matches) {
            el.scheduleForm.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });

        el.scheduleDate.value = dateKey(new Date());
        el.scheduleStartTime.value = "17:00";
        el.scheduleEndTime.value = "23:00";
        setStatus("WORK");
        renderBoard();
        renderFormNote();

        A.initCafeOperatorSession(cafeId, function (session) {
          state.user = session.user;
          state.cafe = session.cafe;
          state.canManage = session.canManage;
          renderCafe();
          updateAvailability();
          if (session.canManage && !state.loaded) {
            loadData();
          } else {
            renderBoard();
          }
        });
      })();
    </script>
    <script src="/assets/js/admin-nav.js"></script>
  </body>
</html>
