name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    name: Android 릴리스 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk

  desktop-package:
    name: Desktop 패키징 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: desktop-linux
            path: composeApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            artifact: desktop-windows
            path: composeApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: desktop-macos
            path: composeApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package desktop distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
        shell: bash

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  github-release:
    name: GitHub Release 생성
    needs: [ android-release, desktop-package ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
